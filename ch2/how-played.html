<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../assets/style.css">
<style>
  .chips { display: grid; grid-template-columns: repeat(9, 1fr); gap: 0.6rem; width: 100%; max-width: 120rem; min-height: 9rem; }
  .ins { background: #fff; border: 0.25rem solid var(--line); border-radius: 1.2rem; padding: 0.2rem; display: flex; flex-direction: column; align-items: center; box-shadow: var(--shadow); }
  .ins svg { width: 100%; height: 6rem; }
  .ins b { font-size: 1.3rem; }
  .ins.gone { visibility: hidden; }
  .bins { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; width: 100%; max-width: 120rem; margin-top: 1rem; }
  .bin { border: 0.35rem dashed; border-radius: var(--radius); min-height: 18rem; padding: 0.6rem; display: flex; flex-wrap: wrap; gap: 0.4rem; align-content: flex-start; justify-content: center; }
  .bin h3 { width: 100%; margin: 0; font-size: 2rem; text-align: center; }
  .bin p { width: 100%; margin: 0 0 0.4rem; text-align: center; color: var(--muted); font-size: 1.2rem; font-weight: 700; }
  .bin .ins { width: 9rem; pointer-events: none; }
  .bin.no { animation: shake 0.4s; }
  .bin.a { border-color: var(--red); background: #ffeef0; } .bin.b { border-color: var(--blue); background: #e7f1ff; } .bin.c { border-color: var(--green); background: #e6f8ef; }
</style>
</head>
<body>
<main class="stage center">
  <p class="hint">How do we play them? Drag each instrument into the right box (or tap it, then tap the box).</p>
  <div class="chips" id="chips"></div>
  <div class="bins">
    <div class="bin a" data-h="beat"><h3>🥢 Beat it</h3><p>We hit it with hands or sticks</p></div>
    <div class="bin b" data-h="string"><h3>🎼 Play the strings</h3><p>We pull or strum the strings</p></div>
    <div class="bin c" data-h="blow"><h3>💨 Blow air</h3><p>We blow air into it</p></div>
  </div>
</main>
<script src="../assets/common.js"></script>
<script src="../assets/math.js"></script>
<script src="../assets/instruments.js"></script>
<script>
G.init({ title: 'How Do We Play It?', subtitle: 'Shapes Around Us · Musical instruments', back: '../index.html#ch2' });

/* From the teacher's note: drum and tabla are beaten, guitar and sitar use strings, shehnai and flute are blown. */
const HOW = { drum: 'beat', tabla: 'beat', dholak: 'beat', guitar: 'string', sitar: 'string', shehnai: 'blow', flute: 'blow', trumpet: 'blow', harmonium: 'blow' };
const SAY = { beat: 'We beat the', string: 'We play the strings of the', blow: 'We blow air into the' };
G.$('#chips').innerHTML = G.shuffle(Object.keys(HOW)).map((k) => insPic(k)).join('');
let done = 0;
const bins = G.$$('.bin');
G.tapDrag(G.$$('#chips .ins'), bins, (chip, bin) => {
  const k = chip.dataset.k, h = HOW[k];
  if (bin.dataset.h !== h) { bin.classList.remove('no'); void bin.offsetWidth; bin.classList.add('no'); G.sfx('bad'); G.say(`Think again. How do we play the ${INS[k].n}?`); return; }
  chip.classList.add('gone'); chip.dataset.locked = 1;
  bin.insertAdjacentHTML('beforeend', insPic(k));
  G.sfx('good'); G.star();
  G.say(k === 'harmonium' ? 'We press the keys and push air into the harmonium.' : `${SAY[h]} ${INS[k].n}.`);
  if (++done === Object.keys(HOW).length) setTimeout(() => G.end({ title: 'Music makers!', msg: 'Some instruments are beaten, some have strings, and some are blown.', onReplay: () => location.reload() }), 1800);
});
G.say('How do we play these instruments?');
</script>
</body>
</html>
