<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../assets/style.css">
<style>
  .q { font-family: var(--read); font-size: 2.6rem; font-weight: 700; margin: 0.2rem 0 1rem; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; width: 100%; max-width: 100rem; }
  .ins { background: #fff; border: 0.3rem solid var(--line); border-radius: var(--radius); padding: 0.4rem; display: flex; flex-direction: column; align-items: center; box-shadow: var(--shadow); }
  .ins svg { width: 100%; max-width: 13rem; height: 8.4rem; }
  .ins b { font-size: 1.8rem; }
  .ins.on { border-color: var(--orange); background: #fff4cc; }
  .ins.right { border-color: var(--green); background: #d9f7e8; }
  .ins.wrong { border-color: var(--red); background: #ffe1e3; animation: shake 0.4s; }
  .ins.cross { position: relative; }
  .ins.cross::after { content: '✘'; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 10rem; color: var(--red); }
  .ins.ref { border-style: dashed; border-color: var(--purple); }
  .solid { width: 9rem; height: 9rem; }
  .choice.sh { display: flex; flex-direction: column; align-items: center; font-size: 1.6rem; padding: 0.4rem 1rem; }
  .choice.txt { font-family: var(--read); font-size: 1.8rem; max-width: 34rem; text-align: left; }
</style>
</head>
<body>
<main class="stage center">
  <div class="progress" id="pg"></div>
  <div class="q" id="q"></div>
  <div id="area" class="center" style="width:100%"></div>
  <div class="feedback" id="fb"></div>
</main>
<script src="../assets/common.js"></script>
<script src="../assets/math.js"></script>
<script src="../assets/instruments.js"></script>
<script>
G.init({ title: 'Shapes of Instruments', subtitle: 'Shapes Around Us · Let us do', back: '../index.html#ch2' });

const pic = insPic;
const SH = ['cube', 'cuboid', 'cone', 'cylinder', 'sphere'];

/* Steps follow the book: i drum, ii matka, iii shehnai, iv harmonium vs drum, C odd one out. */
const STEPS = [
  { kind: 'multi', q: 'Tap all the instruments that are like a drum in shape.', ref: 'drum', set: ['dholak', 'harmonium', 'tabla', 'matka', 'flute', 'shehnai'], why: 'The dholak, tabla and flute are like the drum. They are cylinders.' },
  { kind: 'shape', q: 'The matka looks like which shape?', ref: 'matka', a: 'sphere', why: 'The matka is round like a sphere.' },
  { kind: 'shape', q: 'Tick the shape similar to the shape of a shehnai.', ref: 'shehnai', a: 'cone', why: 'The shehnai is like a cone. It is wide at one end and narrow at the other.' },
  { kind: 'text', q: 'How is the shape of a harmonium different from the shape of a drum?', ref: ['harmonium', 'drum'],
    o: ['The harmonium has flat faces and corners. The drum has a curved face and no corners.', 'Both have only flat faces.', 'The drum has 8 corners.'], why: 'A harmonium is like a cuboid. A drum is like a cylinder.' },
  { kind: 'odd', q: 'Cross the odd one out.', set: ['drum', 'tabla', 'harmonium', 'dholak'], a: 'harmonium', why: 'The harmonium is a cuboid. The others are cylinders.' },
  { kind: 'odd', q: 'Cross the odd one out.', set: ['ball', 'matka', 'shehnai'], a: 'shehnai', why: 'The shehnai is like a cone. The ball and the matka are round like spheres.' },
  { kind: 'odd', q: 'Cross the odd one out.', set: ['flute', 'dice', 'drum', 'tabla'], a: 'dice', why: 'The dice is a cube. The others are cylinders.' },
];
let s = 0;
function show() {
  if (s >= STEPS.length) { G.end({ title: 'Shape spotter!', msg: 'Instruments come in many shapes.', onReplay: () => { s = 0; show(); } }); return; }
  const st = STEPS[s], area = G.$('#area');
  G.progress(G.$('#pg'), s, STEPS.length);
  G.$('#q').textContent = st.q; G.$('#fb').innerHTML = '';
  G.say(st.q);
  if (st.kind === 'multi') {
    area.innerHTML = `<div class="grid">${pic(st.ref, 'ref')}${G.shuffle(st.set).map((k) => pic(k)).join('')}<div class="center" style="justify-content:center"><button class="big-btn green" id="chk">✅ Check</button></div></div>`;
    G.$$('#area .ins:not(.ref)').forEach((b) => (b.onclick = () => { b.classList.toggle('on'); G.sfx('pop'); }));
    G.$('#area .ref').onclick = () => G.say('This is the drum.');
    G.$('#chk').onclick = () => {
      let bad = 0;
      G.$$('#area .ins:not(.ref)').forEach((b) => {
        const want = INS[b.dataset.k].sh === 'cylinder', on = b.classList.contains('on');
        b.classList.remove('wrong');
        if (want && on) b.classList.add('right');
        else if (on !== want) { bad++; if (on) { void b.offsetWidth; b.classList.add('wrong'); } }
      });
      if (bad) { G.sfx('bad'); G.feedback(G.$('#fb'), false, '🙂 Not yet! Look at the shape again.'); return; }
      win(st.why);
    };
  } else if (st.kind === 'shape') {
    area.innerHTML = `<div style="width:24rem">${pic(st.ref)}</div><div class="row" style="margin-top:1rem">${SH.map((k) => `<button class="choice sh" data-v="${k}">${M.solid(k)}${k}</button>`).join('')}</div>`;
    G.$$('#area .choice').forEach((b) => (b.onclick = () => {
      if (b.dataset.v !== st.a) { b.classList.add('wrong'); G.sfx('bad'); setTimeout(() => b.classList.remove('wrong'), 500); return; }
      b.classList.add('right'); win(st.why);
    }));
  } else if (st.kind === 'text') {
    area.innerHTML = `<div class="row">${st.ref.map((k) => `<div style="width:20rem">${pic(k)}</div>`).join('')}</div><div class="row" style="margin-top:1rem">${G.shuffle(st.o).map((o) => `<button class="choice txt">${o}</button>`).join('')}</div>`;
    G.$$('#area .choice').forEach((b) => (b.onclick = () => {
      if (b.textContent !== st.o[0]) { b.classList.add('wrong'); G.sfx('bad'); setTimeout(() => b.classList.remove('wrong'), 500); return; }
      b.classList.add('right'); win(st.why);
    }));
  } else {
    area.innerHTML = `<div class="grid" style="grid-template-columns:repeat(${st.set.length},1fr);max-width:${st.set.length * 22}rem">${G.shuffle(st.set).map((k) => pic(k)).join('')}</div>`;
    G.$$('#area .ins').forEach((b) => (b.onclick = () => {
      if (b.dataset.k !== st.a) { b.classList.add('wrong'); G.sfx('bad'); G.say(`The ${INS[b.dataset.k].n} is like the others.`); setTimeout(() => b.classList.remove('wrong'), 500); return; }
      b.classList.add('cross'); win(st.why);
    }));
  }
}
function win(why) {
  G.$$('#area button').forEach((b) => (b.disabled = true));
  G.star(); G.sfx('good');
  G.feedback(G.$('#fb'), true, '🎉 ' + why); G.say(why);
  s++; setTimeout(show, 3800);
}
show();
</script>
</body>
</html>
