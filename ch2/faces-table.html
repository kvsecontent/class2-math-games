<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../assets/style.css">
<style>
  .wrap { display: grid; grid-template-columns: 1fr 20rem; gap: 1.2rem; width: 100%; max-width: 120rem; align-items: start; }
  table { border-collapse: collapse; width: 100%; background: #fff; border-radius: var(--radius); overflow: hidden; }
  th { background: #e7f1ff; font-size: 1.5rem; padding: 0.3rem; border: 0.2rem solid var(--ink); }
  td { border: 0.2rem solid var(--ink); text-align: center; padding: 0.15rem 0.3rem; font-size: 1.7rem; font-weight: 800; }
  td .solid { width: 3.4rem; height: 3.4rem; vertical-align: middle; margin-right: 0.4rem; }
  td .m-box { height: 3.3rem; min-width: 4.4rem; font-size: 2.2rem; }
  tr.now td { background: #fffbe8; }
  td .like { font-size: 2.6rem; }
  .tip { font-size: 1.3rem; color: var(--muted); font-weight: 700; margin-top: 0.4rem; text-align: left; }
  .side { display: flex; flex-direction: column; gap: 0.7rem; align-items: center; }
  .ask { font-size: 1.6rem; font-weight: 800; color: var(--purple); text-align: center; min-height: 4rem; }
</style>
</head>
<body>
<main class="stage center">
  <p class="hint">Look at the shapes and fill the table: how many <b>faces</b>, <b>edges</b> and <b>corners</b>?</p>
  <div class="wrap">
    <div>
      <table><thead><tr><th>Object</th><th>Faces</th><th>Edges</th><th>Corners</th><th>I look like a</th></tr></thead><tbody id="tb"></tbody></table>
      <p class="tip">💡 A face can be flat or curved. An edge is where two faces meet. A corner is where edges meet in a point.</p>
    </div>
    <div class="side card"><div class="ask" id="ask"></div><div class="m-box on" id="show">?</div><div id="pad"></div><div class="feedback" id="fb"></div></div>
  </div>
</main>
<script src="../assets/common.js"></script>
<script src="../assets/math.js"></script>
<script>
G.init({ title: 'Faces, Edges, Corners', subtitle: 'Shapes Around Us · Let us think', back: '../index.html#ch2' });

/* The five shapes in the book's table. Flat and curved faces both count. */
const ROWS = [
  { k: 'cube', f: 6, e: 12, c: 8, like: '🎲', n: 'dice', why: 'A cube has 6 flat faces, all squares.' },
  { k: 'cuboid', f: 6, e: 12, c: 8, like: '🧱', n: 'brick', why: 'A cuboid has 6 flat faces.' },
  { k: 'cone', f: 2, e: 1, c: 1, like: '🍦', n: 'ice-cream cone', why: 'A cone has 1 flat face, 1 curved face, 1 edge and 1 corner.' },
  { k: 'cylinder', f: 3, e: 2, c: 0, like: '🥫', n: 'tin', why: 'A cylinder has 2 flat faces, 1 curved face, 2 edges and no corners.' },
  { k: 'sphere', f: 1, e: 0, c: 0, like: '⚽', n: 'ball', why: 'A sphere has only 1 curved face. No edges and no corners.' },
];
const COL = { cube: '#2f7de1', cuboid: '#ff8a3d', cone: '#ff6fa8', cylinder: '#2bb673', sphere: '#ffc93c' };
const WHAT = ['faces', 'edges', 'corners'];
let r, c;

function start() {
  r = 0; c = 0;
  G.$('#tb').innerHTML = ROWS.map((x, i) => `<tr data-r="${i}"><td style="text-align:left">${M.solid(x.k, COL[x.k])}${x.k}</td>${WHAT.map((w, j) => `<td><span class="m-box" data-r="${i}" data-c="${j}">?</span></td>`).join('')}<td><span class="like" data-r="${i}"></span></td></tr>`).join('');
  mark();
}
function mark() {
  G.$$('#tb tr').forEach((t) => t.classList.toggle('now', +t.dataset.r === r));
  G.$$('#tb .m-box').forEach((b) => b.classList.toggle('on', +b.dataset.r === r && +b.dataset.c === c));
  if (r < ROWS.length) { const q = `How many ${WHAT[c]} does a ${ROWS[r].k} have?`; G.$('#ask').textContent = q; G.say(q); }
}
const pad = M.pad(G.$('#pad'), {
  show: G.$('#show'), digits: 2,
  onEnter: (v) => {
    pad.clear();
    const row = ROWS[r], want = [row.f, row.e, row.c][c];
    if (v !== want) { G.sfx('bad'); G.feedback(G.$('#fb'), false, '🙂 Count again!'); G.say(`Look at the ${row.k} again.`); return; }
    const b = G.$(`#tb .m-box[data-r="${r}"][data-c="${c}"]`); b.textContent = v; b.className = 'm-box good'; G.sfx('good');
    G.$('#fb').innerHTML = '';
    if (++c < 3) { mark(); return; }
    G.$(`#tb .like[data-r="${r}"]`).textContent = row.like + ' ' + row.n;
    G.star(); G.feedback(G.$('#fb'), true, '🎉 ' + row.why); G.say(row.why + ` I look like a ${row.n}.`);
    r++; c = 0;
    setTimeout(() => (r < ROWS.length ? mark() : G.end({ title: 'Table complete!', msg: 'You counted the faces, edges and corners.', onReplay: start })), 4200);
  },
});
start();
</script>
</body>
</html>
