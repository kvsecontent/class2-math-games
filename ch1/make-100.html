<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../assets/style.css">
<style>
  .wrap { display: grid; grid-template-columns: 1fr 20rem; gap: 1.2rem; width: 100%; max-width: 120rem; align-items: center; }
  .lay { display: flex; gap: 1.6rem; align-items: center; justify-content: center; }
  .grid100 { display: inline-flex; gap: 0.15rem; padding: 0.2rem; background: #2b2140; border-radius: 0.5rem; }
  .col { display: flex; flex-direction: column; gap: 0.15rem; border: 0; padding: 0; background: none; }
  .col i { display: block; width: 2.4rem; height: 2.4rem; border-radius: 0.2rem; background: var(--c); }
  .sent { font-family: var(--read); font-size: 2.1rem; line-height: 2.1; text-align: left; }
  .sent .m-box { min-width: 4.6rem; height: 4rem; font-size: 2.4rem; }
  .tools { display: flex; gap: 0.6rem; }
  .sw { width: 4.6rem; height: 4.6rem; border-radius: 50%; border: 0.3rem solid #fff; box-shadow: 0 0 0 0.2rem var(--line); }
  .sw.on { box-shadow: 0 0 0 0.4rem var(--ink); }
  .side { display: flex; flex-direction: column; gap: 0.7rem; align-items: center; }
</style>
</head>
<body>
<main class="stage center">
  <p class="hint" id="hint">Let us make 100! Ten strips joined together make a 100 units grid. Count and fill in the blanks.</p>
  <div class="progress" id="pg"></div>
  <div class="wrap">
    <div class="card lay"><div><div class="grid100" id="grid"></div><div class="tools" id="tools" style="margin-top:0.6rem;justify-content:center"></div></div><div class="sent" id="sent"></div></div>
    <div class="side card"><div class="m-box on" id="show">?</div><div id="pad"></div><div class="feedback" id="fb"></div></div>
  </div>
</main>
<script src="../assets/common.js"></script>
<script src="../assets/math.js"></script>
<script>
G.init({ title: 'Let us Make 100!', subtitle: 'A Day at the Beach · 10 tens make 100' });

/* 7 yellow + 3 red is the book example. Then other ways, then the children make their own. */
const Y = '#ffc93c', R = '#e63946';
const TEXT = '[y] yellow units and [r] red units.<br>[ys] yellow ten strips and [rs] red ten strips.<br>Total [100] units or [10] ten strips.';
const ROUNDS = () => [7, ...G.shuffle([1, 2, 3, 4, 5, 6, 8, 9]).slice(0, 3), 'own'];
let rounds, k, cols, vals, b, pick = Y;

function start() { rounds = ROUNDS(); k = 0; next(); }
function draw() {
  G.$('#grid').innerHTML = cols.map((c, i) => `<button class="col" data-i="${i}" style="--c:${c}">${'<i></i>'.repeat(10)}</button>`).join('');
}
function next() {
  if (k >= rounds.length) { G.end({ title: 'You made 100!', msg: '10 ten strips make 100 units.', onReplay: start }); return; }
  G.progress(G.$('#pg'), k, rounds.length);
  b = 0; G.$('#fb').innerHTML = '';
  const y = rounds[k];
  if (y === 'own') {
    cols = Array(10).fill('#fff'); pick = Y;
    G.$('#tools').innerHTML = [Y, R].map((c) => `<button class="sw ${c === pick ? 'on' : ''}" data-c="${c}" style="background:${c}"></button>`).join('');
    G.$('#hint').textContent = 'Your turn! Pick a colour and tap the strips. Colour all 10 strips, then fill in the blanks.';
    G.$('#sent').innerHTML = '';
    G.say('Make your own 100. Colour the ten strips yellow and red.');
  } else {
    cols = Array.from({ length: 10 }, (_, i) => (i < y ? Y : R));
    G.$('#tools').innerHTML = '';
    fill(y);
    G.say(`Count the yellow and the red.`);
  }
  draw();
}
function fill(y) {
  vals = [y * 10, (10 - y) * 10, y, 10 - y, 100, 10];
  let i = 0;
  G.$('#sent').innerHTML = TEXT.replace(/\[\w+\]/g, () => `<span class="m-box" data-i="${i++}">?</span>`);
  mark();
}
function mark() { G.$$('#sent .m-box').forEach((x) => x.classList.toggle('on', +x.dataset.i === b)); }
G.$('#tools').onclick = (e) => { const s = e.target.closest('.sw'); if (!s) return; pick = s.dataset.c; G.$$('.sw').forEach((x) => x.classList.toggle('on', x === s)); };
G.$('#grid').onclick = (e) => {
  const c = e.target.closest('.col');
  if (!c || rounds[k] !== 'own' || G.$('#sent .m-box')) return;
  cols[+c.dataset.i] = pick; draw(); G.sfx('pop');
  if (cols.every((x) => x !== '#fff')) {
    const y = cols.filter((x) => x === Y).length;
    if (y === 0 || y === 10) { G.say('Use both colours!'); return; }
    fill(y);
    G.say('Now fill in the blanks.');
  }
};
const pad = M.pad(G.$('#pad'), {
  show: G.$('#show'),
  onEnter: (v) => {
    pad.clear();
    if (!G.$('#sent .m-box')) { G.say('First colour all the strips.'); return; }
    if (v !== vals[b]) { G.sfx('bad'); G.feedback(G.$('#fb'), false, '🙂 Count again!'); return; }
    const box = G.$(`#sent .m-box[data-i="${b}"]`);
    box.textContent = v; box.className = 'm-box good'; G.sfx('good'); G.$('#fb').innerHTML = '';
    if (++b < vals.length) { mark(); return; }
    G.star(); G.feedback(G.$('#fb'), true, '🎉 ' + G.praise());
    G.say(`${vals[0]} and ${vals[1]} make 100.`);
    k++; setTimeout(next, 3000);
  },
});
start();
</script>
</body>
</html>
