<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../assets/style.css">
<style>
  .wrap { display: grid; grid-template-columns: 1fr 20rem; gap: 1.2rem; width: 100%; max-width: 120rem; align-items: center; }
  .shop { border-radius: var(--radius); border: 0.25rem solid var(--line); background: #fff; overflow: hidden; }
  .shop .roof { height: 1.8rem; background: repeating-linear-gradient(90deg, #e63946 0 3rem, #fff 3rem 6rem); }
  .shop .name { font-size: 2rem; font-weight: 800; margin: 0.4rem 0 0; }
  .goods { display: flex; flex-wrap: wrap; gap: 1rem; justify-content: center; align-items: center; padding: 0.6rem; min-height: 12rem; }
  .bunch { display: grid; grid-template-columns: repeat(5, 2.3rem); gap: 0.1rem; padding: 0.4rem; border: 0.25rem solid #c9a46a; border-radius: 1.6rem; background: #fff8ec; font-size: 2.1rem; line-height: 1.1; }
  .loose { display: flex; flex-wrap: wrap; gap: 0.2rem; max-width: 12rem; font-size: 2.1rem; }
  .sent { font-family: var(--read); font-size: 2.3rem; line-height: 2.2; margin: 0.6rem 1rem 1rem; }
  .side { display: flex; flex-direction: column; gap: 0.8rem; align-items: center; }
</style>
</head>
<body>
<main class="stage center">
  <p class="hint">Look at the shop. Fill in the blanks — use the number pad.</p>
  <div class="progress" id="pg"></div>
  <div class="wrap">
    <div class="shop"><div class="roof"></div><div class="name" id="name"></div><div class="goods" id="goods"></div><div class="sent" id="sent"></div></div>
    <div class="side card"><div class="m-box on" id="show" style="font-size:3.4rem">?</div><div id="pad"></div><div class="feedback" id="fb"></div></div>
  </div>
</main>
<script src="../assets/common.js"></script>
<script src="../assets/math.js"></script>
<script>
G.init({ title: 'Beach Shops', subtitle: 'A Day at the Beach · Groups of ten' });

/* The three shops from the book. The numbers are made fresh each time. */
const SHOPS = [
  { name: '🐚 Shell shop', e: '🐚', make: () => { const k = M.rnd(2, 6); return { k, l: 0, text: 'There are [k] necklaces of shells with 10 shells in each necklace.', vals: [k] }; } },
  { name: '🎈 Balloon shop', e: '🎈', make: () => { const k = M.rnd(2, 5), l = M.rnd(1, 9); return { k, l, text: 'There are [k] groups of balloons with [10] balloons in each group and [l] loose balloons.', vals: [k, 10, l] }; } },
  { name: '🍌 Fruit shop', e: '🍌', make: () => { const k = M.rnd(2, 5), l = M.rnd(1, 9); return { k, l, text: 'There are [k] bunches of bananas with [10] bananas in each bunch and [l] loose bananas.', vals: [k, 10, l] }; } },
];
let order = [], r = 0, q, b = 0;

function start() { order = [...SHOPS, ...SHOPS]; r = 0; next(); }
function next() {
  if (r >= order.length) { G.end({ title: 'Shop helper!', msg: 'You counted the groups of ten and the loose ones.', onReplay: start }); return; }
  G.progress(G.$('#pg'), r, order.length);
  const s = order[r];
  q = s.make(); b = 0;
  G.$('#name').textContent = s.name;
  G.$('#goods').innerHTML = `<div class="bunch">${`<span>${s.e}</span>`.repeat(10)}</div>`.repeat(q.k) + (q.l ? `<div class="loose">${`<span>${s.e}</span>`.repeat(q.l)}</div>` : '');
  let i = 0;
  G.$('#sent').innerHTML = q.text.replace(/\[\w+\]/g, () => `<span class="m-box" data-i="${i++}">?</span>`);
  G.$('#fb').innerHTML = '';
  mark();
  G.say(q.text.replace(/\[\w+\]/g, 'blank'));
}
function mark() { G.$$('#sent .m-box').forEach((x) => x.classList.toggle('on', +x.dataset.i === b)); }
const pad = M.pad(G.$('#pad'), {
  show: G.$('#show'),
  onEnter: (v) => {
    pad.clear();
    if (v !== q.vals[b]) { G.sfx('bad'); G.feedback(G.$('#fb'), false, '🙂 Count again!'); return; }
    const box = G.$(`#sent .m-box[data-i="${b}"]`);
    box.textContent = v; box.className = 'm-box good';
    G.sfx('good'); G.$('#fb').innerHTML = '';
    b++;
    if (b < q.vals.length) { mark(); return; }
    G.star();
    G.feedback(G.$('#fb'), true, '🎉 ' + G.praise());
    G.say(G.$('#sent').textContent);
    r++; setTimeout(next, 3800);
  },
});
start();
</script>
</body>
</html>
