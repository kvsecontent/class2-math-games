<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../assets/style.css">
<style>
  .race { display: flex; flex-direction: column; gap: 0.6rem; margin-bottom: 1rem; }
  .lane { position: relative; height: 6.4rem; border-radius: 1.2rem; background: repeating-linear-gradient(90deg, #4fb6e8 0 3rem, #5ec3f0 3rem 6rem); border: 0.3rem solid #2a8fc0; overflow: hidden; }
  .lane::after { content: '🏁'; position: absolute; right: 0.6rem; top: 50%; transform: translateY(-50%); font-size: 3.6rem; }
  .lane .name { position: absolute; left: 0.8rem; top: 0.3rem; font-weight: 800; font-size: 1.2rem; color: #fff; text-shadow: 0 1px 2px #000; z-index: 1; }
  .rider { position: absolute; top: 50%; font-size: 4.6rem; line-height: 1; transition: left 0.9s cubic-bezier(.3, 1.4, .5, 1); transform: translateY(-50%); }
  .rider span { display: inline-block; transform: scaleX(-1); }
  .lane.turn { box-shadow: 0 0 0 0.4rem var(--yellow); }
  .lane.a { border-color: var(--red); } .lane.b { border-color: var(--blue); }
  .turn-tag { font-size: 1.8rem; font-weight: 800; padding: 0.3rem 1.2rem; border-radius: 1rem; color: #fff; display: inline-block; }
  .q .e { font-size: 5rem; line-height: 1; }
  .q .t { font-family: var(--read); font-size: 2.5rem; margin: 0.4rem 0 1rem; }
  .choice { font-family: var(--read); font-size: 2.2rem; }
  .setup .row input { font-family: var(--head); font-size: 1.8rem; padding: 0.5rem 1rem; border-radius: 1rem; border: 0.2rem solid var(--line); width: 16rem; }
</style>
</head>
<body>
<main class="stage center">
  <div class="race" style="width:100%">
    <div class="lane a" id="laneA"><span class="name" id="nameA">Team A</span><div class="rider" id="rA" style="left:1%"><span>🚣</span></div></div>
    <div class="lane b" id="laneB"><span class="name" id="nameB">Team B</span><div class="rider" id="rB" style="left:1%"><span>🏄</span></div></div>
  </div>
  <div class="card setup center" id="setup" style="width:100%;max-width:70rem">
    <div class="prompt">🏁 Beach Race</div>
    <p class="hint">Two teams take turns. Each right answer moves your boat forward. First to the 🏁 wins!</p>
    <div class="row"><input id="inA" value="Team A" aria-label="Team A name"><input id="inB" value="Team B" aria-label="Team B name"></div>
    <br><button class="big-btn green" id="go">▶ Start the race</button>
  </div>
  <div class="card" id="game" style="width:100%;max-width:76rem;display:none"></div>
</main>
<script src="../assets/common.js"></script>
<script>
G.init({ title: 'Beach Race', subtitle: 'A Day at the Beach · Whole chapter challenge' });

/* Questions from the whole chapter (o[0] is the right answer). */
const BANK = [
  { e: '📿', t: 'A necklace has 10 shells. How many shells are on 3 necklaces?', o: ['30', '13', '3'] },
  { e: '🧺', t: 'How many chikoos are there in one tray?', o: ['10', '5', '100'] },
  { e: '🧺🧺 + 🟤🟤🟤🟤🟤', t: '2 trays of ten and 5 chikoos make ____.', o: ['25', '52', '7'] },
  { e: '🟤', t: '43 chikoos = ____ trays of ten and 3 chikoos.', o: ['4', '3', '43'] },
  { e: '🟤', t: '58 chikoos = 5 trays of ten and ____ chikoos.', o: ['8', '5', '58'] },
  { e: '🧱', t: '1 block stick = ____ blocks', o: ['10', '1', '100'] },
  { e: '🟧', t: '1 ten strip = ____ units', o: ['10', '2', '20'] },
  { e: '🧱', t: '3 block sticks and 4 blocks = ____ blocks', o: ['34', '43', '7'] },
  { e: '🟧', t: '72 units = ____ ten strips and 2 units', o: ['7', '2', '72'] },
  { e: '🟨', t: '7 yellow ten strips and 3 red ten strips make ____ units.', o: ['100', '73', '10'] },
  { e: '🔟', t: 'How many ten strips make 100?', o: ['10', '100', '1'] },
  { e: '🏦', t: 'In the banker game, 10 units are changed for ____.', o: ['1 ten strip', '1 unit', '10 ten strips'] },
  { e: '🃏', t: '31 = 30 + ____', o: ['1', '3', '13'] },
  { e: '🃏', t: '93 = ____ + 3', o: ['90', '9', '39'] },
  { e: '🃏', t: '75 = ____ tens and 5 ones', o: ['7', '5', '75'] },
  { e: '🃏', t: '29 = 2 tens and ____ ones', o: ['9', '2', '29'] },
  { e: '🔢', t: '50 + 2 = ____', o: ['52', '25', '7'] },
  { e: '🔢', t: '20 + 7 = ____', o: ['27', '72', '9'] },
  { e: '🍊', t: 'Which is more: 43 oranges or 34 oranges?', o: ['43', '34'] },
  { e: '🍊', t: 'Which is less: 27 oranges or 72 oranges?', o: ['27', '72'] },
  { e: '🍊', t: 'Which is more: 43 oranges or 47 oranges?', o: ['47', '43'] },
  { e: '🟤', t: '67 chikoos are ____ than 76 chikoos.', o: ['less', 'more'] },
  { e: '🐚', t: '53 shells are ____ than 35 shells.', o: ['more', 'less'] },
  { e: '🤔', t: 'I am the largest two-digit number. Who am I?', o: ['99', '98', '100'] },
  { e: '🤔', t: 'I am the smallest two-digit number. Who am I?', o: ['10', '11', '1'] },
  { e: '🤔', t: 'The smallest two-digit number with repeated digits is ____.', o: ['11', '10', '22'] },
  { e: '🤔', t: 'The smallest two-digit number with 3 at the tens place is ____.', o: ['30', '31', '13'] },
  { e: '🤔', t: 'The largest two-digit number with 2 at the ones place is ____.', o: ['92', '29', '99'] },
  { e: '🃏', t: 'Which number is between 47 and 59?', o: ['52', '45', '61'] },
  { e: '⬇️', t: 'Which is in decreasing order?', o: ['86, 63, 29', '29, 63, 86', '63, 86, 29'] },
  { e: '🚣', t: 'The boat that comes after the second boat is ____.', o: ['third', 'first', 'fifth'] },
  { e: '📅', t: 'Independence Day is on ____ August.', o: ['15', '26', '2'] },
  { e: '📅', t: 'How many days are there in August?', o: ['31', '30', '28'] },
  { e: '👕', t: 'Arya wears jersey number 17. The number 17 is a ____.', o: ['label', 'count of players', 'price'] },
];
const STEPS = 7;
const T = [{ id: 'A', pos: 0, col: 'var(--red)' }, { id: 'B', pos: 0, col: 'var(--blue)' }];
let turn = 0, deck = [], name = ['Team A', 'Team B'];

function place() { T.forEach((t) => (G.$('#r' + t.id).style.left = 1 + (t.pos / STEPS) * 84 + '%')); }

G.$('#go').onclick = () => {
  name = [G.$('#inA').value || 'Team A', G.$('#inB').value || 'Team B'];
  G.$('#nameA').textContent = name[0];
  G.$('#nameB').textContent = name[1];
  G.$('#setup').style.display = 'none';
  G.$('#game').style.display = '';
  start();
};

function start() {
  T.forEach((t) => (t.pos = 0));
  turn = 0;
  deck = G.shuffle(BANK);
  place();
  ask();
}

function ask() {
  if (!deck.length) deck = G.shuffle(BANK);
  const q = deck.pop();
  const t = T[turn];
  G.$('#laneA').classList.toggle('turn', turn === 0);
  G.$('#laneB').classList.toggle('turn', turn === 1);
  const g = G.$('#game');
  g.innerHTML = `<span class="turn-tag" style="background:${t.col}">${name[turn]}'s turn</span>
    <div class="q"><div class="e">${q.e}</div><div class="t">${q.t}</div></div>
    <div class="row" id="opts"></div><div class="feedback" id="fb"></div>`;
  G.say(name[turn] + '. ' + q.t.replace(/_+/g, 'blank').replace(/…/g, ','));
  G.shuffle(q.o).forEach((o) => {
    const b = document.createElement('button');
    b.className = 'choice';
    b.textContent = o;
    b.onclick = () => answer(b, o === q.o[0], q);
    G.$('#opts').append(b);
  });
}

function answer(b, ok, q) {
  G.$$('#opts .choice').forEach((x) => (x.disabled = true));
  const fb = G.$('#fb');
  if (ok) {
    b.classList.add('right');
    G.sfx('good');
    G.feedback(fb, true, `🎉 Right! ${name[turn]} moves ahead!`);
    G.say('Right!');
    T[turn].pos++;
    place();
    if (T[turn].pos >= STEPS) {
      setTimeout(() => G.end({ title: `🏆 ${name[turn]} wins!`, msg: 'Great race, everyone!', onReplay: start }), 1200);
      return;
    }
  } else {
    b.classList.add('wrong');
    G.$$('#opts .choice').find((x) => x.textContent === q.o[0]).classList.add('right');
    G.sfx('bad');
    G.feedback(fb, false, `Oops! The answer is “${q.o[0]}”.`);
    G.say('The answer is ' + q.o[0]);
  }
  turn = 1 - turn;
  setTimeout(ask, 2600);
}
</script>
</body>
</html>
