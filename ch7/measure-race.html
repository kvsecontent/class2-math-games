<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../assets/style.css">
<style>
  .race { display: flex; flex-direction: column; gap: 0.6rem; margin-bottom: 1rem; }
  .lane { position: relative; height: 6.4rem; border-radius: 1.2rem; background: repeating-linear-gradient(90deg, #d9b98a 0 3rem, #cfac78 3rem 6rem); border: 0.3rem solid #8b5a2b; overflow: hidden; }
  .lane::after { content: '🏁'; position: absolute; right: 0.6rem; top: 50%; transform: translateY(-50%); font-size: 3.6rem; }
  .lane .name { position: absolute; left: 0.8rem; top: 0.3rem; font-weight: 800; font-size: 1.2rem; color: #fff; text-shadow: 0 1px 2px #000; z-index: 1; }
  .rider { position: absolute; top: 50%; font-size: 4.6rem; line-height: 1; transition: left 0.9s cubic-bezier(.3, 1.4, .5, 1); transform: translateY(-50%); }
  .rider span { display: inline-block; transform: scaleX(-1); }
  .lane.turn { box-shadow: 0 0 0 0.4rem var(--yellow); }
  .lane.a { border-color: var(--red); } .lane.b { border-color: var(--blue); }
  .turn-tag { font-size: 1.8rem; font-weight: 800; padding: 0.3rem 1.2rem; border-radius: 1rem; color: #fff; display: inline-block; }
  .q .e { font-size: 5rem; line-height: 1; }
  .q .t { font-family: var(--read); font-size: 2.5rem; margin: 0.4rem 0 1rem; }
  .choice { font-family: var(--read); font-size: 2.2rem; }
  .setup .row input { font-family: var(--head); font-size: 1.8rem; padding: 0.5rem 1rem; border-radius: 1rem; border: 0.2rem solid var(--line); width: 16rem; }
</style>
</head>
<body>
<main class="stage center">
  <div class="race" style="width:100%">
    <div class="lane a" id="laneA"><span class="name" id="nameA">Team A</span><div class="rider" id="rA" style="left:1%"><span>🏇</span></div></div>
    <div class="lane b" id="laneB"><span class="name" id="nameB">Team B</span><div class="rider" id="rB" style="left:1%"><span>🐎</span></div></div>
  </div>
  <div class="card setup center" id="setup" style="width:100%;max-width:70rem">
    <div class="prompt">🏁 Royal Race</div>
    <p class="hint">Two teams take turns. Each right answer moves your horse forward. First to the 🏁 wins!</p>
    <div class="row"><input id="inA" value="Team A" aria-label="Team A name"><input id="inB" value="Team B" aria-label="Team B name"></div>
    <br><button class="big-btn green" id="go">▶ Start the race</button>
  </div>
  <div class="card" id="game" style="width:100%;max-width:76rem;display:none"></div>
</main>
<script src="../assets/common.js"></script>
<script>
G.init({ title: 'Royal Race', subtitle: 'Rani’s Gift · Whole chapter challenge', back: '../index.html#ch7' });

/* Questions from the whole chapter (o[0] is the right answer). */
const BANK = [
  { e: '👑', t: 'Raja Jagdeep wanted a bed ____ handspans long.', o: ['10', '8', '14'] },
  { e: '🛏️', t: 'Why did the Raja and the carpenter get different lengths?', o: ['Their hands are different sizes.', 'The bed grew.', 'They forgot to count.'] },
  { e: '📏', t: 'To get the same answer, everyone should use ____.', o: ['the same measure', 'their own hand', 'no measure'] },
  { e: '✋', t: 'A big hand measures a bed. A small hand will count ____ handspans.', o: ['more', 'fewer', 'the same'] },
  { e: '📘', t: 'We guess a length before measuring. This is called ____.', o: ['estimating', 'adding', 'colouring'] },
  { e: '🧵', t: 'Which path is the shortest between two points?', o: ['a straight path', 'a zig-zag path', 'a wavy path'] },
  { e: '〰️', t: 'We can check the length of a curvy path with a ____.', o: ['thread', 'spoon', 'leaf'] },
  { e: '🦒', t: 'The giraffe is 9 blocks tall. The monkey is 4 blocks tall. Who is taller?', o: ['giraffe', 'monkey'] },
  { e: '🧸', t: 'The teddy is 5 blocks and the elephant is 7 blocks. How many more for the elephant?', o: ['2', '12', '5'] },
  { e: '🎃', t: 'Which is heavier?', o: ['pumpkin', 'chilli'] },
  { e: '🥕', t: 'Which is lighter?', o: ['carrot', 'watermelon'] },
  { e: '⚖️', t: 'On a balance, the heavier side goes ____.', o: ['down', 'up', 'away'] },
  { e: '⚖️', t: 'If both sides of a balance are level, the weights are ____.', o: ['equal', 'heavy', 'light'] },
  { e: '🥦', t: 'Capsicum is lighter than ____.', o: ['cauliflower', 'chilli', 'a pea'] },
  { e: '🛍️', t: 'Two same bags, one with sand and one with dry leaves. Heavier?', o: ['sand', 'dry leaves'] },
  { e: '🍉', t: '6 mangoes balance a watermelon. 1 coconut = 2 mangoes. How many coconuts balance it?', o: ['3', '6', '12'] },
  { e: '🥥', t: '1 coconut weighs the same as ____ mangoes.', o: ['2', '1', '10'] },
  { e: '🍋', t: 'For 1 glass of nimbu pani we need ____ spoons of lemon juice.', o: ['2', '1', '3'] },
  { e: '🍋', t: 'For 3 glasses of nimbu pani, how many glasses of water?', o: ['3', '1', '6'] },
  { e: '🍋', t: 'For 3 glasses of nimbu pani, how many spoons of lemon juice?', o: ['6', '3', '2'] },
  { e: '🥄', t: 'For 3 glasses, how many spoons of sugar?', o: ['3', '1', '6'] },
  { e: '🍶', t: 'Raghu’s bottle holds ____ glasses of water.', o: ['4', '3', '6'] },
  { e: '🍶', t: 'Tara’s bottle holds 6 glasses. Raghu’s holds 4. Tara’s holds ____.', o: ['more', 'less', 'equal'] },
  { e: '🍶', t: 'Meena’s bottle holds 3 glasses. Raghu’s holds 4. Meena’s holds ____.', o: ['less', 'more', 'equal'] },
  { e: '🎵', t: 'In a jal tarang, a glass with more water rings ____.', o: ['lower', 'higher', 'louder only'] },
  { e: '💧', t: 'What should we do with water?', o: ['Use it well and not waste it', 'Leave taps open', 'Throw it away'] },
  { e: '🚪', t: 'What can we use to measure a door?', o: ['handspans', 'a cup', 'a balance'] },
  { e: '⚖️', t: 'What do we use to compare weights?', o: ['a balance', 'a ruler', 'a glass'] },
];
const STEPS = 7;
const T = [{ id: 'A', pos: 0, col: 'var(--red)' }, { id: 'B', pos: 0, col: 'var(--blue)' }];
let turn = 0, deck = [], name = ['Team A', 'Team B'];

function place() { T.forEach((t) => (G.$('#r' + t.id).style.left = 1 + (t.pos / STEPS) * 84 + '%')); }

G.$('#go').onclick = () => {
  name = [G.$('#inA').value || 'Team A', G.$('#inB').value || 'Team B'];
  G.$('#nameA').textContent = name[0];
  G.$('#nameB').textContent = name[1];
  G.$('#setup').style.display = 'none';
  G.$('#game').style.display = '';
  start();
};

function start() {
  T.forEach((t) => (t.pos = 0));
  turn = 0;
  deck = G.shuffle(BANK);
  place();
  ask();
}

function ask() {
  if (!deck.length) deck = G.shuffle(BANK);
  const q = deck.pop();
  const t = T[turn];
  G.$('#laneA').classList.toggle('turn', turn === 0);
  G.$('#laneB').classList.toggle('turn', turn === 1);
  const g = G.$('#game');
  g.innerHTML = `<span class="turn-tag" style="background:${t.col}">${name[turn]}'s turn</span>
    <div class="q"><div class="e">${q.e}</div><div class="t">${q.t}</div></div>
    <div class="row" id="opts"></div><div class="feedback" id="fb"></div>`;
  G.say(name[turn] + '. ' + q.t.replace(/_+/g, 'blank').replace(/…/g, ','));
  G.shuffle(q.o).forEach((o) => {
    const b = document.createElement('button');
    b.className = 'choice';
    b.textContent = o;
    b.onclick = () => answer(b, o === q.o[0], q);
    G.$('#opts').append(b);
  });
}

function answer(b, ok, q) {
  G.$$('#opts .choice').forEach((x) => (x.disabled = true));
  const fb = G.$('#fb');
  if (ok) {
    b.classList.add('right');
    G.sfx('good');
    G.feedback(fb, true, `🎉 Right! ${name[turn]} moves ahead!`);
    G.say('Right!');
    T[turn].pos++;
    place();
    if (T[turn].pos >= STEPS) {
      setTimeout(() => G.end({ title: `🏆 ${name[turn]} wins!`, msg: 'Great race, everyone!', onReplay: start }), 1200);
      return;
    }
  } else {
    b.classList.add('wrong');
    G.$$('#opts .choice').find((x) => x.textContent === q.o[0]).classList.add('right');
    G.sfx('bad');
    G.feedback(fb, false, `Oops! The answer is “${q.o[0]}”.`);
    G.say('The answer is ' + q.o[0]);
  }
  turn = 1 - turn;
  setTimeout(ask, 2600);
}
</script>
</body>
</html>
