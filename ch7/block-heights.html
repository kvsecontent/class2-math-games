<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../assets/style.css">
<style>
  .wrap { display: grid; grid-template-columns: minmax(0, 1fr) 22rem; gap: 1.2rem; width: 100%; max-width: 120rem; align-items: center; }
  .shelf { display: flex; gap: 0.8rem; align-items: flex-end; justify-content: center; background: #fff; border-radius: var(--radius); border: 0.25rem solid var(--line); padding: 1rem; min-height: 30rem; }
  .toy { display: flex; align-items: flex-end; gap: 0.3rem; }
  .stack { display: flex; flex-direction: column-reverse; gap: 0.1rem; }
  .stack i { width: 2.2rem; height: 1.5rem; border: 0.15rem solid #2b2140; border-radius: 0.3rem; display: flex; align-items: center; justify-content: center; font-style: normal; font-size: 0.95rem; font-weight: 800; }
  .pic { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; }
  .pic span { line-height: 1; }
  .pic b { font-size: 1.4rem; }
  .q { font-family: var(--read); font-size: 2rem; font-weight: 700; text-align: center; }
  .side { display: flex; flex-direction: column; gap: 0.6rem; align-items: center; }
  .choice { font-size: 1.6rem; min-width: 0; min-height: 3.8rem; padding: 0.3rem 0.8rem; }
  #hand { width: 100%; max-height: calc(100vh - 14rem); background: #fff; border-radius: var(--radius); border: 0.25rem solid var(--line); }
</style>
</head>
<body>
<main class="stage center">
  <p class="hint" style="margin-bottom:0.3rem">How many blocks? Let me stack the blocks and find the height of my toys.</p>
  <div class="progress" id="pg"></div>
  <div class="wrap">
    <div id="left"></div>
    <div class="card side"><div class="q" id="q"></div><div class="row" id="opts"></div><div id="padbox" class="side"><div class="m-box on" id="show">?</div><div id="pad"></div></div><div class="feedback" id="fb"></div></div>
  </div>
</main>
<script src="../assets/common.js"></script>
<script src="../assets/math.js"></script>
<script>
G.init({ title: 'How Many Blocks?', subtitle: 'Rani’s Gift · Measuring height', back: '../index.html#ch7' });

/* The book has a giraffe, a monkey, and toys that are 7 and 5 blocks tall. Our toys and heights match that. */
const TOYS = [{ n: 'giraffe', e: '🦒', h: 9 }, { n: 'elephant', e: '🐘', h: 7 }, { n: 'monkey', e: '🐒', h: 4 }, { n: 'teddy bear', e: '🧸', h: 5 }];
const COLS = ['#e63946', '#ff8a3d', '#ffc93c', '#2bb673', '#2f7de1', '#8a5cf6', '#ff6fa8', '#13b5b1', '#8b5a2b'];
const shelf = () => `<div class="shelf">${TOYS.map((t) => `<div class="toy"><div class="pic"><span style="font-size:${t.h * 1.5}rem">${t.e}</span><b>${t.n}</b></div><div class="stack">${Array.from({ length: t.h }, (_, i) => `<i style="background:${COLS[i]}">${i + 1}</i>`).join('')}</div></div>`).join('')}</div>`;
const handPic = () => { let h = '<svg id="hand" viewBox="0 0 600 420">'; for (let i = 0; i <= 10; i++) h += `<line x1="0" y1="${30 + i * 36}" x2="600" y2="${30 + i * 36}" stroke="#9ec9f0" stroke-width="2"/>`; return h + '<text x="300" y="282" font-size="270" text-anchor="middle" dominant-baseline="auto">✋</text><path d="M470 66 L470 318" stroke="#e63946" stroke-width="5"/><path d="M460 66 L480 66 M460 318 L480 318" stroke="#e63946" stroke-width="5"/></svg>'; };
const STEPS = [
  { t: 'A. The giraffe is ___ blocks tall.', pad: 9 },
  { t: 'B. The ___ is 7 blocks tall.', pick: 'elephant' },
  { t: 'C. The monkey is ___ blocks tall.', pad: 4 },
  { t: 'D. The ___ is 5 blocks tall.', pick: 'teddy bear' },
  { t: 'Which toy is the tallest?', pick: 'giraffe' },
  { t: 'Which toy is the shortest?', pick: 'monkey' },
  { t: 'How long is this hand? Count the spaces between the red marks.', pad: 7, hand: true },
];
let k = 0;
function show() {
  if (k >= STEPS.length) { G.end({ title: 'Block builder!', msg: 'Now trace your own hand and count the lines!', onReplay: () => { k = 0; show(); } }); return; }
  G.progress(G.$('#pg'), k, STEPS.length);
  const st = STEPS[k];
  G.$('#left').innerHTML = st.hand ? handPic() : shelf();
  G.$('#q').textContent = st.t; G.$('#fb').innerHTML = ''; pad.clear();
  G.$('#padbox').style.display = st.pad ? '' : 'none';
  G.$('#opts').innerHTML = st.pick ? G.shuffle(TOYS).map((t) => `<button class="choice">${t.e} ${t.n}</button>`).join('') : '';
  G.$$('#opts .choice').forEach((b) => (b.onclick = () => {
    if (!b.textContent.endsWith(st.pick)) { b.classList.add('wrong'); G.sfx('bad'); setTimeout(() => b.classList.remove('wrong'), 500); return; }
    b.classList.add('right'); win(st.t.replace('___', st.pick).replace(/^Which toy is the (\w+)\?$/, `The ${st.pick} is the $1.`));
  }));
  G.say(st.t.replace('___', 'blank').replace(/^[A-D]\. /, ''));
}
const pad = M.pad(G.$('#pad'), {
  show: G.$('#show'), digits: 2,
  onEnter: (v) => { pad.clear(); const st = STEPS[k]; if (v !== st.pad) { G.sfx('bad'); G.feedback(G.$('#fb'), false, '🙂 Count again.'); return; } win(st.hand ? `The hand is ${v} spaces long.` : st.t.replace('___', v)); },
});
function win(msg) { G.star(); G.sfx('good'); msg = msg.replace(/^[A-D]\. /, ''); G.feedback(G.$('#fb'), true, '🎉 ' + msg); G.say(msg); k++; setTimeout(show, 2600); }
show();
</script>
</body>
</html>
