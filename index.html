<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Class 2 Maths – Joyful Mathematics Games</title>
<link rel="stylesheet" href="assets/style.css">
<style>
  .hero {
    display: flex; align-items: center; gap: 1.2rem;
    padding: 1rem 1.6rem; background: linear-gradient(120deg, #9fe3ff, #a8f0c6 60%, #ffe08a);
  }
  .hero .logo { font-size: 4rem; animation: bob 2.5s ease-in-out infinite; }
  .hero h1 { margin: 0; font-size: 2.6rem; line-height: 1; }
  .hero p { margin: 0.2rem 0 0; font-size: 1.2rem; font-weight: 700; color: #5a3d2b; }
  .hero .spacer { flex: 1; }

  .tabs {
    display: flex; gap: 0.6rem; overflow-x: auto; padding: 0.9rem 1.6rem 0.4rem;
    scrollbar-width: thin; background: #fff; border-bottom: 0.25rem solid var(--line);
    position: sticky; top: 0; z-index: 20;
  }
  .tab {
    flex: none; border: 0.2rem solid var(--line); background: #fff;
    border-radius: 1.2rem 1.2rem 0.4rem 0.4rem; padding: 0.5rem 1.2rem; min-height: 4rem;
    font-size: 1.2rem; font-weight: 800; text-align: left; line-height: 1.1;
  }
  .tab small { display: block; font-size: 0.85rem; font-weight: 600; color: var(--muted); }
  .tab.on { background: var(--purple); border-color: var(--purple); color: #fff; }
  .tab.on small { color: #e9e0ff; }
  .tab.soon { opacity: 0.55; }

  .chap-head { display: flex; align-items: baseline; gap: 1rem; flex-wrap: wrap; margin: 0.6rem 0 0.4rem; }
  .chap-head h2 { margin: 0; font-size: 2.3rem; }
  .chap-head span { font-size: 1.2rem; color: var(--muted); font-weight: 700; }

  .section-title {
    font-size: 1.35rem; font-weight: 800; margin: 1.4rem 0 0.6rem;
    display: inline-block; padding: 0.2rem 1rem; border-radius: 2rem; color: #fff;
  }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(16rem, 1fr)); gap: 1rem; margin-top: 0.8rem; }
  .tag { align-self: flex-start; color: #fff; font-size: 0.95rem; font-weight: 800; padding: 0.1rem 0.7rem; border-radius: 1rem; }
  .game {
    display: flex; flex-direction: column; gap: 0.3rem; text-decoration: none; color: inherit;
    background: #fff; border-radius: var(--radius); border: 0.22rem solid var(--line);
    box-shadow: 0 0.45rem 0 rgba(43, 33, 64, 0.1); padding: 0.8rem 1.1rem; min-height: 9rem;
    transition: transform 0.12s;
  }
  .game:active { transform: scale(0.97); }
  .game .ic { font-size: 3rem; line-height: 1.1; }
  .game b { font-size: 1.5rem; }
  .game em { font-style: normal; color: var(--muted); font-size: 1.05rem; font-weight: 600; }
  .soon-box { text-align: center; padding: 3rem 1rem; font-size: 1.6rem; color: var(--muted); }
  .soon-box div { font-size: 5rem; }
</style>
</head>
<body>
  <div class="hero">
    <div class="logo">🔢</div>
    <div>
      <h1>Maths Fun Games</h1>
      <p>Class 2 · Joyful Mathematics · Tap a chapter, then tap a game!</p>
    </div>
    <div class="spacer"></div>
    <button class="tb-btn" onclick="document.documentElement.requestFullscreen?.()">⛶ Full screen</button>
  </div>

  <nav class="tabs" id="tabs"></nav>
  <main class="stage" id="main"></main>

<script>
/* Chapters of Joyful Mathematics (Class 2). Add games to a chapter to switch its tab on. */
const COLORS = { count: '#2f7de1', tens: '#ff8a3d', cards: '#13b5b1', compare: '#e63946', play: '#8a5cf6', order: '#2bb673', tug: '#8b5a2b', race: '#ff6fa8' };
const CHAPTERS = [
  {
    n: 1, title: 'A Day at the Beach', unit: 'Numbers up to 100 · tens and ones',
    sections: [
      { key: 'count', name: '🔢 Counting in groups', games: [
        { href: 'ch1/beach-count.html', ic: '🥥', t: 'Count at the Beach', d: 'Coconuts, children, boats, oranges – count in tens' },
        { href: 'ch1/beach-shops.html', ic: '🎈', t: 'Beach Shops', d: 'Necklaces of 10 shells, balloons, bananas' },
        { href: 'ch1/surbhi-shells.html', ic: '🐚', t: 'Surbhi’s Shells', d: 'Make equal groups for bracelets and necklaces' },
        { href: 'ch1/sea-shells.html', ic: '👅', t: 'She Sells Seashells', d: 'Tongue twister · things that come in tens' },
      ]},
      { key: 'tens', name: '🧺 Tens and ones', games: [
        { href: 'ch1/chikoo-trays.html', ic: '🧺', t: 'Tasty Chikoos!', d: 'Put chikoos in trays of ten: 25, 43, 35, 58' },
        { href: 'ch1/chikoo-match.html', ic: '🔗', t: 'Match the Chikoos', d: '80 · 72 · 56 · 28 chikoos' },
        { href: 'ch1/blocks-strips.html', ic: '🧱', t: 'Blocks and Strips', d: '3 block sticks and 4 blocks = 34' },
        { href: 'ch1/make-100.html', ic: '💯', t: 'Let us Make 100!', d: '7 yellow + 3 red ten strips = 100' },
        { href: 'ch1/banker.html', ic: '🏦', t: 'The Banker Game', d: 'Roll two dice, exchange 10 units for a ten strip' },
      ]},
      { key: 'cards', name: '🃏 Tens and ones cards', games: [
        { href: 'ch1/tens-cards.html', ic: '🃏', t: 'Tens and Ones Cards', d: '31 = 30 + 1 = 3 tens 1 one' },
        { href: 'ch1/make-numbers.html', ic: '🧩', t: 'Make Numbers', d: '50 and 2 make 52' },
      ]},
      { key: 'compare', name: '⚖️ More or less', games: [
        { href: 'ch1/orange-trays.html', ic: '🍊', t: 'Trays of Oranges', d: '43 or 34 – which is more?' },
        { href: 'ch1/more-less.html', ic: '📝', t: 'More Than, Less Than', d: '___ is less than 41' },
      ]},
      { key: 'play', name: '🎲 Play with numbers', games: [
        { href: 'ch1/flash-cards.html', ic: '🎴', t: 'Flash Card Game', d: 'Make a number greater than 50 · swap the cards' },
        { href: 'ch1/who-am-i.html', ic: '🤔', t: 'Who am I?', d: 'I am the largest two-digit number…' },
        { href: 'ch1/number-path.html', ic: '🐸', t: 'Mark the Path', d: 'Hop from the largest to the smallest' },
      ]},
      { key: 'order', name: '🚣 Numbers around us', games: [
        { href: 'ch1/boat-race.html', ic: '🚣', t: 'Vallam Kali', d: 'Boat race: first, second, third…' },
        { href: 'ch1/calendar.html', ic: '📅', t: 'The August Calendar', d: 'Independence Day · Onam · Raksha Bandhan' },
        { href: 'ch1/number-labels.html', ic: '👕', t: 'Numbers as Labels', d: 'Jersey number 17, house number, bus number' },
      ]},
      { key: 'tug', name: '🪢 Tug of War', games: [
        { href: 'ch1/tug-of-war.html', ic: '🪢', t: 'Tug of War', d: 'Two players – each right answer pulls the rope!' },
      ]},
      { key: 'race', name: '🏁 Class challenge', games: [
        { href: 'ch1/beach-race.html', ic: '🏆', t: 'Beach Race', d: 'Team A vs Team B – whole chapter quiz' },
      ]},
    ],
  },
  ...Array.from({ length: 10 }, (_, i) => ({ n: i + 2, title: 'Coming soon', unit: '', sections: [] })),
];

const tabs = document.getElementById('tabs');
const main = document.getElementById('main');

function show(n) {
  const ch = CHAPTERS.find((c) => c.n === n) || CHAPTERS[0];
  [...tabs.children].forEach((b) => b.classList.toggle('on', +b.dataset.n === ch.n));
  history.replaceState(null, '', '#ch' + ch.n);
  if (!ch.sections.length) {
    main.innerHTML = `<div class="soon-box"><div>🚧</div>Chapter ${ch.n} games are coming soon!</div>`;
    return;
  }
  main.innerHTML = `
    <div class="chap-head"><h2>Chapter ${ch.n} · ${ch.title}</h2><span>${ch.unit}</span></div>
    <div class="grid">${ch.sections.map((s) => s.games.map((g) => `
      <a class="game" href="${g.href}" style="border-color:${COLORS[s.key]}55">
        <span class="tag" style="background:${COLORS[s.key]}">${s.name}</span>
        <span class="ic">${g.ic}</span><b>${g.t}</b><em>${g.d}</em>
      </a>`).join('')).join('')}
    </div>`;
}

tabs.innerHTML = CHAPTERS.map((c) => `
  <button class="tab ${c.sections.length ? '' : 'soon'}" data-n="${c.n}">Chapter ${c.n}<small>${c.title}</small></button>`).join('');
tabs.addEventListener('click', (e) => { const b = e.target.closest('.tab'); if (b) show(+b.dataset.n); });

show(+(location.hash.match(/ch(\d+)/)?.[1] || 1));
window.addEventListener('hashchange', () => show(+(location.hash.match(/ch(\d+)/)?.[1] || 1)));
</script>
</body>
</html>
