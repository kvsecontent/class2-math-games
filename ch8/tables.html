<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../assets/style.css">
<style>
  .tabs { display: flex; gap: 0.6rem; justify-content: center; margin-bottom: 0.5rem; }
  .tabs button.on { background: var(--purple); color: #fff; }
  .wrap { display: grid; grid-template-columns: 1fr 1fr 20rem; gap: 1.2rem; width: 100%; max-width: 120rem; align-items: center; }
  .tbl { display: grid; grid-template-columns: auto auto; gap: 0.1rem 1.6rem; font-size: 1.9rem; font-weight: 800; background: #fff; border-radius: var(--radius); border: 0.25rem solid var(--line); padding: 0.6rem 1rem; }
  .tbl span { padding: 0.05rem 0.4rem; border-radius: 0.6rem; white-space: nowrap; }
  .tbl span.now { background: #fff4cc; }
  .tbl .a { color: var(--green); }
  .dots { display: flex; flex-wrap: wrap; gap: 0.6rem; justify-content: center; align-content: center; background: #fff; border-radius: var(--radius); border: 0.25rem solid var(--line); min-height: 26rem; padding: 0.6rem; }
  .dots .g { display: grid; grid-template-columns: repeat(5, 1.6rem); gap: 0.2rem; padding: 0.3rem; border: 0.2rem dashed var(--purple); border-radius: 0.8rem; }
  .dots .g i { width: 1.6rem; height: 1.6rem; border-radius: 50%; background: var(--orange); }
  .side { display: flex; flex-direction: column; gap: 0.6rem; align-items: center; }
</style>
</head>
<body>
<main class="stage center">
  <div class="tabs" id="tabs"></div>
  <div class="wrap">
    <div class="tbl" id="tbl"></div>
    <div class="dots" id="dots"></div>
    <div class="card side"><div class="m-box on" id="show">?</div><div id="pad"></div><div class="feedback" id="fb"></div></div>
  </div>
</main>
<script src="../assets/common.js"></script>
<script src="../assets/math.js"></script>
<script>
G.init({ title: 'Times Tables', subtitle: 'Grouping and Sharing · Complete the table', back: '../index.html#ch8' });

/* The book asks for the tables of 2, 3, 5 and 10. */
const WORDS = ['', 'ones', 'twos', 'threes', 'fours', 'fives', 'sixes', 'sevens', 'eights', 'nines', 'tens'];
const T = [2, 3, 5, 10];
let t = 2, row = 1;
const done = {};
G.$('#tabs').innerHTML = T.map((n) => `<button class="big-btn ghost" data-t="${n}">Table of ${n}</button>`).join('');
G.$$('#tabs button').forEach((b) => (b.onclick = () => { t = +b.dataset.t; row = 1; draw(); G.say(`Table of ${t}. ${t} ones are?`); }));
function draw() {
  G.$$('#tabs button').forEach((b) => b.classList.toggle('on', +b.dataset.t === t));
  G.$('#tbl').innerHTML = Array.from({ length: 10 }, (_, i) => {
    const j = i + 1, filled = j < row, a = filled ? `<b class="a">${t * j}</b>` : j === row ? '<b>?</b>' : '…';
    return `<span class="${j === row ? 'now' : ''}">${t} ${WORDS[j]} are ${a}</span><span class="${j === row ? 'now' : ''}">${t} × ${j} = ${a}</span>`;
  }).join('');
  // book reads "2 threes are 6" = 2 × 3: t groups of j
  G.$('#dots').innerHTML = row <= 10 ? Array.from({ length: t }, () => `<div class="g">${'<i></i>'.repeat(row)}</div>`).join('') : '<div style="font-size:5rem">🎉</div>';
  G.$('#fb').innerHTML = ''; pad.clear();
}
const pad = M.pad(G.$('#pad'), {
  show: G.$('#show'),
  onEnter: (v) => {
    pad.clear();
    if (row > 10) return;
    if (v !== t * row) { G.sfx('bad'); G.feedback(G.$('#fb'), false, `🙂 Count the dots: ${t} groups of ${row}.`); return; }
    G.sfx('good'); row++;
    G.say(`${t} times ${row - 1} is ${v}.` + (row <= 10 ? ` ${t} ${WORDS[row]} are?` : ''), { rate: 1 });
    if (row > 10) {
      done[t] = true; G.star(3); draw();
      G.feedback(G.$('#fb'), true, `🎉 Table of ${t} complete!`);
      const next = T.find((n) => !done[n]);
      setTimeout(() => (next ? (t = next, row = 1, draw(), G.say(`Table of ${t}. ${t} ones are?`)) : G.end({ title: 'Table champion!', msg: 'Tables of 2, 3, 5 and 10 – all done!', onReplay: () => location.reload() })), 2600);
      return;
    }
    draw();
  },
});
draw();
G.say('Table of 2. 2 ones are?');
</script>
</body>
</html>
