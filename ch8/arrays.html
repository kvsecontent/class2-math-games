<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../assets/style.css">
<style>
  .wrap { display: grid; grid-template-columns: minmax(0, 1fr) 24rem; gap: 1.2rem; width: 100%; max-width: 120rem; align-items: start; }
  .tray { background: #fff; border-radius: var(--radius); border: 0.25rem solid var(--line); min-height: 26rem; display: flex; align-items: center; justify-content: center; padding: 0.8rem; }
  .arr { display: grid; gap: 0.35rem; }
  .arr span { font-size: 2rem; line-height: 1; text-align: center; transition: all 0.3s; }
  .arr .row { display: contents; }
  .pick { display: flex; flex-wrap: wrap; gap: 0.4rem; justify-content: center; margin-top: 0.6rem; }
  .pick button { min-width: 4.4rem; min-height: 4.4rem; font-size: 1.8rem; font-weight: 800; border-radius: 1rem; border: 0.25rem solid var(--line); background: #fff; }
  .pick button.found { background: #d9f7e8; border-color: var(--green); }
  .pick button.nope { background: #ffe1e3; border-color: #ffc2c7; }
  .side { display: flex; flex-direction: column; gap: 0.5rem; align-items: stretch; }
  .facts { display: grid; grid-template-columns: 1fr 1fr; gap: 0.3rem; }
  .facts span { font-size: 1.5rem; font-weight: 800; background: #f7f3ea; border-radius: 0.6rem; padding: 0.2rem 0.4rem; text-align: center; min-height: 2.6rem; }
  .facts span.got { background: #d9f7e8; }
  .q { font-family: var(--read); font-size: 1.7rem; font-weight: 700; text-align: center; min-height: 4.6rem; }
</style>
</head>
<body>
<main class="stage center">
  <p class="hint" style="margin-bottom:0.3rem">Project work: arrange 24 buttons in equal rows. How many rows? Tap a number. Find all the multiplication facts for 24!</p>
  <div class="wrap">
    <div><div class="tray" id="tray"></div><div class="pick" id="pick"></div></div>
    <div class="card side"><div class="q" id="q">Tap a number of rows.</div><div class="facts" id="facts"></div><button class="big-btn green" id="fin" style="display:none">🏁 I found them all!</button></div>
  </div>
</main>
<script src="../assets/common.js"></script>
<script>
G.init({ title: 'Arrays of 24', subtitle: 'Grouping and Sharing · Project work', back: '../index.html#ch8' });

/* 24 objects in equal rows: every way is a multiplication fact, e.g. 3 groups of 8 = 3 × 8. */
const N = 24, E = '🔘';
const WAYS = [1, 2, 3, 4, 6, 8, 12, 24];
const found = new Set();
function tray(rows) {
  if (!rows) { G.$('#tray').innerHTML = `<div class="arr" style="grid-template-columns:repeat(8, 2.6rem)">${`<span>${E}</span>`.repeat(N)}</div>`; return; }
  const cols = Math.ceil(N / rows), flip = rows > 6; // many rows: draw each row as a standing line so it fits
  const cells = Array.from({ length: N }, (_, i) => `<span style="${N % rows && Math.floor(i / cols) === rows - 1 ? 'opacity:0.45' : ''}">${E}</span>`);
  G.$('#tray').innerHTML = flip
    ? `<div class="arr" style="grid-auto-flow:column;grid-template-rows:repeat(${cols}, 2.4rem);grid-template-columns:repeat(${rows}, 2.4rem)">${cells.join('')}</div>`
    : `<div class="arr" style="grid-template-columns:repeat(${cols}, 2.6rem)">${cells.join('')}</div>`;
}
function facts() { G.$('#facts').innerHTML = WAYS.map((r) => `<span class="${found.has(r) ? 'got' : ''}">${found.has(r) ? `${r} × ${N / r} = 24` : '?'}</span>`).join(''); }
G.$('#pick').innerHTML = Array.from({ length: 12 }, (_, i) => i + 1).concat([24]).map((n) => `<button data-n="${n}">${n}</button>`).join('');
G.$$('#pick button').forEach((b) => (b.onclick = () => {
  const r = +b.dataset.n; tray(r);
  if (N % r) {
    b.classList.add('nope'); G.sfx('bad');
    const msg = `${r} rows? The rows are not equal – ${N % r} button${N % r > 1 ? 's are' : ' is'} left over.`;
    G.$('#q').textContent = msg; G.say(msg); return;
  }
  const c = N / r; b.classList.add('found');
  const msg = `${r} rows of ${c}. ${r} groups of ${c} is 24. ${r} × ${c} = 24.`;
  G.$('#q').textContent = msg; G.say(msg.replace('×', 'times'));
  if (!found.has(r)) { found.add(r); G.star(); G.sfx('good'); facts(); }
  if (found.size === WAYS.length) setTimeout(() => G.end({ title: 'Array expert!', msg: 'You found all 8 ways to arrange 24!', onReplay: () => location.reload() }), 2600);
  else if (found.size >= 4) G.$('#fin').style.display = '';
}));
G.$('#fin').onclick = () => G.end({ title: 'Great arranging!', msg: `You found ${found.size} of the 8 facts for 24. Try with real buttons or bottle caps!`, onReplay: () => location.reload() });
tray(0); facts();
G.say('Arrange 24 buttons in equal rows. Tap a number of rows.');
</script>
</body>
</html>
