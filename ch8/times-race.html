<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../assets/style.css">
<style>
  .race { display: flex; flex-direction: column; gap: 0.6rem; margin-bottom: 1rem; }
  .lane { position: relative; height: 6.4rem; border-radius: 1.2rem; background: repeating-linear-gradient(90deg, #8d8d8d 0 3rem, #9a9a9a 3rem 6rem); border: 0.3rem solid #666; overflow: hidden; }
  .lane::after { content: '🏁'; position: absolute; right: 0.6rem; top: 50%; transform: translateY(-50%); font-size: 3.6rem; }
  .lane .name { position: absolute; left: 0.8rem; top: 0.3rem; font-weight: 800; font-size: 1.2rem; color: #fff; text-shadow: 0 1px 2px #000; z-index: 1; }
  .rider { position: absolute; top: 50%; font-size: 4.6rem; line-height: 1; transition: left 0.9s cubic-bezier(.3, 1.4, .5, 1); transform: translateY(-50%); }
  .rider span { display: inline-block; transform: scaleX(-1); }
  .lane.turn { box-shadow: 0 0 0 0.4rem var(--yellow); }
  .lane.a { border-color: var(--red); } .lane.b { border-color: var(--blue); }
  .turn-tag { font-size: 1.8rem; font-weight: 800; padding: 0.3rem 1.2rem; border-radius: 1rem; color: #fff; display: inline-block; }
  .q .e { font-size: 5rem; line-height: 1; }
  .q .t { font-family: var(--read); font-size: 2.5rem; margin: 0.4rem 0 1rem; }
  .choice { font-family: var(--read); font-size: 2.2rem; }
  .setup .row input { font-family: var(--head); font-size: 1.8rem; padding: 0.5rem 1rem; border-radius: 1rem; border: 0.2rem solid var(--line); width: 16rem; }
</style>
</head>
<body>
<main class="stage center">
  <div class="race" style="width:100%">
    <div class="lane a" id="laneA"><span class="name" id="nameA">Team A</span><div class="rider" id="rA" style="left:1%"><span>🚗</span></div></div>
    <div class="lane b" id="laneB"><span class="name" id="nameB">Team B</span><div class="rider" id="rB" style="left:1%"><span>🛺</span></div></div>
  </div>
  <div class="card setup center" id="setup" style="width:100%;max-width:70rem">
    <div class="prompt">🏁 Traffic Race</div>
    <p class="hint">Two teams take turns. Each right answer moves your car forward. First to the 🏁 wins!</p>
    <div class="row"><input id="inA" value="Team A" aria-label="Team A name"><input id="inB" value="Team B" aria-label="Team B name"></div>
    <br><button class="big-btn green" id="go">▶ Start the race</button>
  </div>
  <div class="card" id="game" style="width:100%;max-width:76rem;display:none"></div>
</main>
<script src="../assets/common.js"></script>
<script>
G.init({ title: 'Traffic Race', subtitle: 'Grouping and Sharing · Whole chapter challenge', back: '../index.html#ch8' });

/* Questions from the whole chapter (o[0] is the right answer). */
const BANK = [
  { e: '🚲', t: '4 bicycles, 2 wheels each. 4 × 2 = ____', o: ['8', '6', '42'] },
  { e: '🛺', t: '2 autos, 3 wheels each. 2 × 3 = ____', o: ['6', '5', '23'] },
  { e: '🚗', t: '7 cars, 4 wheels each. How many wheels?', o: ['28', '11', '24'] },
  { e: '🦋', t: '3 butterflies, 2 wings each. How many wings?', o: ['6', '5', '32'] },
  { e: '🐙', t: '2 octopuses, 8 legs each. How many legs?', o: ['16', '10', '28'] },
  { e: '💂', t: '4 lines of 10 soldiers. How many soldiers?', o: ['40', '14', '410'] },
  { e: '➕', t: '2 + 2 + 2 + 2 is the same as ____', o: ['4 × 2', '2 × 2', '4 + 2'] },
  { e: '➕', t: '9 + 9 + 9 = ____', o: ['27', '18', '39'] },
  { e: '➕', t: '7 fives are ____', o: ['35', '12', '57'] },
  { e: '➕', t: '4 groups of 10 are ____', o: ['40', '14', '410'] },
  { e: '➕', t: '2 sevens are ____', o: ['14', '9', '27'] },
  { e: '✖️', t: '3 × 8 = ____', o: ['24', '11', '38'] },
  { e: '✖️', t: '5 times 3 is ____', o: ['15', '8', '53'] },
  { e: '2️⃣', t: '2 × 6 = ____', o: ['12', '8', '26'] },
  { e: '3️⃣', t: '3 × 4 = ____', o: ['12', '7', '34'] },
  { e: '5️⃣', t: '5 × 6 = ____', o: ['30', '11', '56'] },
  { e: '🔟', t: '10 × 7 = ____', o: ['70', '17', '107'] },
  { e: '💐', t: '4 bouquets of 3 flowers and 3 bouquets of 4 flowers. Which has more?', o: ['Both are the same', '4 bouquets of 3', '3 bouquets of 4'] },
  { e: '🔴', t: '8 packets with 5 bindis each. How many bindis?', o: ['40', '13', '85'] },
  { e: '👕', t: '7 shirts with 4 buttons each. How many buttons?', o: ['28', '11', '24'] },
  { e: '✏️', t: '6 pencils at ₹4 each. How much money?', o: ['₹24', '₹10', '₹64'] },
  { e: '🚗', t: '5 people in each car. How many in 8 cars?', o: ['40', '13', '58'] },
  { e: '📋', t: 'Table of 2 + table of 2 makes the table of ____', o: ['4', '2', '22'] },
  { e: '📋', t: 'Table of 3 + table of 4 makes the table of ____', o: ['7', '12', '34'] },
  { e: '🔘', t: '24 buttons in 3 equal rows. How many in each row?', o: ['8', '6', '21'] },
  { e: '🟤', t: '8 gulab jamuns shared equally by 2. Each gets ____', o: ['4', '6', '10'] },
  { e: '🍦', t: '12 bindis shared equally on 2 cones. Each cone gets ____', o: ['6', '10', '14'] },
  { e: '🕯️', t: '27 candles in 3 boxes equally. Each box has ____', o: ['9', '7', '24'] },
  { e: '🍌', t: '24 bananas for 3 monkeys equally. Each gets ____', o: ['8', '6', '21'] },
  { e: '⭐', t: '20 beads, 5 on each bracelet. How many bracelets?', o: ['4', '5', '15'] },
  { e: '🌹', t: '25 roses, 5 in each vase. How many vases?', o: ['5', '20', '30'] },
  { e: '🔘', t: '30 buttons, 6 on each shirt. How many shirts?', o: ['5', '6', '24'] },
];
const STEPS = 7;
const T = [{ id: 'A', pos: 0, col: 'var(--red)' }, { id: 'B', pos: 0, col: 'var(--blue)' }];
let turn = 0, deck = [], name = ['Team A', 'Team B'];

function place() { T.forEach((t) => (G.$('#r' + t.id).style.left = 1 + (t.pos / STEPS) * 84 + '%')); }

G.$('#go').onclick = () => {
  name = [G.$('#inA').value || 'Team A', G.$('#inB').value || 'Team B'];
  G.$('#nameA').textContent = name[0];
  G.$('#nameB').textContent = name[1];
  G.$('#setup').style.display = 'none';
  G.$('#game').style.display = '';
  start();
};

function start() {
  T.forEach((t) => (t.pos = 0));
  turn = 0;
  deck = G.shuffle(BANK);
  place();
  ask();
}

function ask() {
  if (!deck.length) deck = G.shuffle(BANK);
  const q = deck.pop();
  const t = T[turn];
  G.$('#laneA').classList.toggle('turn', turn === 0);
  G.$('#laneB').classList.toggle('turn', turn === 1);
  const g = G.$('#game');
  g.innerHTML = `<span class="turn-tag" style="background:${t.col}">${name[turn]}'s turn</span>
    <div class="q"><div class="e">${q.e}</div><div class="t">${q.t}</div></div>
    <div class="row" id="opts"></div><div class="feedback" id="fb"></div>`;
  G.say(name[turn] + '. ' + q.t.replace(/_+/g, 'blank').replace(/…/g, ','));
  G.shuffle(q.o).forEach((o) => {
    const b = document.createElement('button');
    b.className = 'choice';
    b.textContent = o;
    b.onclick = () => answer(b, o === q.o[0], q);
    G.$('#opts').append(b);
  });
}

function answer(b, ok, q) {
  G.$$('#opts .choice').forEach((x) => (x.disabled = true));
  const fb = G.$('#fb');
  if (ok) {
    b.classList.add('right');
    G.sfx('good');
    G.feedback(fb, true, `🎉 Right! ${name[turn]} moves ahead!`);
    G.say('Right!');
    T[turn].pos++;
    place();
    if (T[turn].pos >= STEPS) {
      setTimeout(() => G.end({ title: `🏆 ${name[turn]} wins!`, msg: 'Great race, everyone!', onReplay: start }), 1200);
      return;
    }
  } else {
    b.classList.add('wrong');
    G.$$('#opts .choice').find((x) => x.textContent === q.o[0]).classList.add('right');
    G.sfx('bad');
    G.feedback(fb, false, `Oops! The answer is “${q.o[0]}”.`);
    G.say('The answer is ' + q.o[0]);
  }
  turn = 1 - turn;
  setTimeout(ask, 2600);
}
</script>
</body>
</html>
