<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../assets/style.css">
<style>
  .wrap { display: grid; grid-template-columns: 1fr 20rem; gap: 1.2rem; width: 100%; max-width: 120rem; align-items: center; }
  .board { background: #fff; border-radius: var(--radius); border: 0.25rem solid var(--line); min-height: 22rem; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.6rem; padding: 1rem; }
  .ttl { font-size: 2rem; font-weight: 800; color: var(--purple); }
  .fam { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem 2.4rem; font-size: 2.8rem; font-weight: 800; }
  .tri { display: flex; gap: 0.6rem; font-size: 2.4rem; font-weight: 800; }
  .tri span { background: #fff4cc; border-radius: 50%; width: 4.6rem; height: 4.6rem; display: flex; align-items: center; justify-content: center; }
  .m-box { height: 4.2rem; min-width: 4.8rem; font-size: 2.6rem; }
  .pyr { display: flex; flex-direction: column; align-items: center; gap: 0.3rem; }
  .pyr .r { display: flex; gap: 0.3rem; }
  .brick { width: 7rem; height: 4.6rem; border: 0.25rem solid #8b5a2b; border-radius: 0.5rem; background: #ffe3c4; display: flex; align-items: center; justify-content: center; font-size: 2.6rem; font-weight: 800; }
  .brick .m-box { height: 3.8rem; min-width: 5.4rem; border-width: 0.2rem; }
  .side { display: flex; flex-direction: column; gap: 0.6rem; align-items: center; }
  .q { font-family: var(--read); font-size: 1.6rem; font-weight: 700; text-align: center; }
  #dia { width: 30rem; height: 30rem; }
</style>
</head>
<body>
<main class="stage center">
  <p class="hint" style="margin-bottom:0.3rem">Addition and subtraction facts, pyramids and diagrams. Fill the missing numbers!</p>
  <div class="progress" id="pg"></div>
  <div class="wrap">
    <div class="board" id="board"></div>
    <div class="card side"><div class="q" id="q"></div><div class="m-box on" id="show">?</div><div id="pad"></div><div class="feedback" id="fb"></div></div>
  </div>
</main>
<script src="../assets/common.js"></script>
<script src="../assets/math.js"></script>
<script>
G.init({ title: 'Number Puzzles', subtitle: 'Decoration for Festival · Facts, pyramids and diagrams', back: '../index.html#ch6' });

const box = (i) => `<span class="m-box" data-i="${i}">?</span>`;
/* Fact families from the book (20, 30, 50 · 10, 20, 30 · 20, 80, 100).
   Pyramids: the book's small addition pyramids (5, 3 · 6, 8 · 6, 4 · 3, 8) and our own bigger ones.
   Diagram: the book's example 3, 9, 6, 5 and one of our own. */
function family([a, b, c]) {
  return { ttl: 'Fact family', q: `${a}, ${b} and ${c} make a fact family. Fill the missing numbers.`, vals: [c, c, a, b],
    html: `<div class="tri"><span>${a}</span><span>${b}</span><span>${c}</span></div><div class="fam"><div>${a} + ${b} = ${box(0)}</div><div>${b} + ${a} = ${box(1)}</div><div>${c} − ${b} = ${box(2)}</div><div>${c} − ${a} = ${box(3)}</div></div>` };
}
function smallPyr(pairs) {
  return { ttl: 'Addition pyramid', q: 'Add the two bricks below to get the brick on top.', vals: pairs.map(([a, b]) => a + b),
    html: `<div class="row" style="gap:2rem">${pairs.map(([a, b], i) => `<div class="pyr"><div class="r"><div class="brick">${box(i)}</div></div><div class="r"><div class="brick">${a}</div><div class="brick">${b}</div></div></div>`).join('')}</div>` };
}
function bigPyr() {
  const [x, y, z] = [M.rnd(3, 15), M.rnd(3, 15), M.rnd(3, 15)], m1 = x + y, m2 = y + z, top = m1 + m2;
  return { ttl: 'Addition pyramid', q: 'Each brick is the sum of the two bricks below it.', vals: [m1, m2, top],
    html: `<div class="pyr"><div class="r"><div class="brick">${box(2)}</div></div><div class="r"><div class="brick">${box(0)}</div><div class="brick">${box(1)}</div></div><div class="r"><div class="brick">${x}</div><div class="brick">${y}</div><div class="brick">${z}</div></div></div>` };
}
function subPyr() {
  const [x, y, z] = [M.rnd(3, 15), M.rnd(3, 15), M.rnd(3, 15)], m1 = x + y, m2 = y + z, top = m1 + m2;
  return { ttl: 'Subtraction pyramid', q: 'Take away to find the missing bricks. Top − one brick = the other brick.', vals: [m2, x, z],
    html: `<div class="pyr"><div class="r"><div class="brick">${top}</div></div><div class="r"><div class="brick">${m1}</div><div class="brick">${box(0)}</div></div><div class="r"><div class="brick">${box(1)}</div><div class="brick">${y}</div><div class="brick">${box(2)}</div></div></div>` };
}
function diagram(c) {
  const sums = [c[0] + c[1], c[1] + c[2], c[2] + c[3], c[3] + c[0]];
  const P = [[60, 60], [240, 60], [240, 240], [60, 240]], mid = [[150, 60], [240, 150], [150, 240], [60, 150]];
  return { ttl: 'Number diagram', q: 'Add the two corner numbers on each side. Write the sum in the middle.', vals: sums,
    html: `<svg id="dia" viewBox="0 0 300 300"><rect x="60" y="60" width="180" height="180" fill="none" stroke="#2b2140" stroke-width="4"/>${P.map(([x, y], i) => `<circle cx="${x}" cy="${y}" r="30" fill="#ffd34d" stroke="#2b2140" stroke-width="3"/><text x="${x}" y="${y + 11}" font-size="30" font-weight="800" text-anchor="middle">${c[i]}</text>`).join('')}
      ${mid.map(([x, y], i) => `<foreignObject x="${x - 34}" y="${y - 26}" width="68" height="52"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;justify-content:center">${box(i).replace('m-box', 'm-box" style="height:2.4rem;min-width:3rem;font-size:1.6rem')}</div></foreignObject>`).join('')}</svg>` };
}
const STEPS = () => [family([20, 30, 50]), family([10, 20, 30]), family([20, 80, 100]), smallPyr([[5, 3], [6, 8], [6, 4], [3, 8]]), bigPyr(), subPyr(), diagram([3, 9, 6, 5]), diagram([M.rnd(2, 12), M.rnd(2, 12), M.rnd(2, 12), M.rnd(2, 12)])];
let steps, s, b;
function start() { steps = STEPS(); s = 0; next(); }
function next() {
  if (s >= steps.length) { G.end({ title: 'Puzzle master!', msg: 'Adding and taking away are a family!', onReplay: start }); return; }
  G.progress(G.$('#pg'), s, steps.length);
  const st = steps[s]; b = 0;
  G.$('#board').innerHTML = `<div class="ttl">${st.ttl}</div>${st.html}`; G.$('#q').textContent = st.q; G.$('#fb').innerHTML = ''; pad.clear();
  mark(); G.say(st.q);
}
function mark() { G.$$('#board .m-box').forEach((x) => x.classList.toggle('on', +x.dataset.i === b)); }
const pad = M.pad(G.$('#pad'), {
  show: G.$('#show'),
  onEnter: (v) => {
    pad.clear(); const st = steps[s];
    if (v !== st.vals[b]) { G.sfx('bad'); G.feedback(G.$('#fb'), false, '🙂 Try again.'); return; }
    const x = G.$(`#board .m-box[data-i="${b}"]`); x.textContent = v; x.classList.remove('on'); x.classList.add('good'); G.sfx('good'); G.$('#fb').innerHTML = '';
    if (++b < st.vals.length) { mark(); return; }
    G.star(); G.feedback(G.$('#fb'), true, '🎉 ' + G.praise()); G.say(G.praise());
    s++; setTimeout(next, 2200);
  },
});
start();
</script>
</body>
</html>
