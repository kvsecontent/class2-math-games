<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../assets/style.css">
<style>
  .wrap { display: grid; grid-template-columns: 1fr 20rem; gap: 1.2rem; width: 100%; max-width: 120rem; align-items: start; }
  table { border-collapse: collapse; width: 100%; background: #fff; border-radius: var(--radius); overflow: hidden; }
  th { background: #fff4cc; font-size: 1.3rem; padding: 0.2rem; border: 0.18rem solid var(--ink); }
  td { border: 0.18rem solid var(--ink); text-align: center; padding: 0.1rem 0.3rem; font-size: 1.6rem; font-weight: 800; }
  td .m-box { height: 3rem; min-width: 3.8rem; font-size: 1.9rem; }
  td.pic { text-align: left; }
  .gar { display: inline-block; width: 2.4rem; height: 2.4rem; border-radius: 50%; border: 0.45rem dotted #ff8a3d; background: #fff4cc; margin-right: 0.15rem; vertical-align: middle; }
  .fl { font-size: 1.1rem; }
  tr.now td { background: #fffbe8; }
  .q { font-family: var(--read); font-size: 1.8rem; font-weight: 700; text-align: center; min-height: 4.6rem; }
  .side { display: flex; flex-direction: column; gap: 0.6rem; align-items: center; }
</style>
</head>
<body>
<main class="stage center">
  <p class="hint" style="margin-bottom:0.3rem">Decoration for celebration! Each garland has 10 flowers. Complete the table, then find how many flowers friends bring together.</p>
  <div class="wrap">
    <table><thead><tr><th>Name</th><th>Garlands and flowers</th><th>Garlands</th><th>Loose flowers</th><th>Total</th></tr></thead><tbody id="tb"></tbody></table>
    <div class="card side"><div class="progress" id="pg"></div><div class="q" id="q"></div><div class="m-box on" id="show">?</div><div id="pad"></div><div class="feedback" id="fb"></div></div>
  </div>
</main>
<script src="../assets/common.js"></script>
<script src="../assets/math.js"></script>
<script>
G.init({ title: 'Flowers for the Festival', subtitle: 'Decoration for Festival · Garlands of ten', back: '../index.html#ch6' });

/* Names and numbers from the book's table. Then the "together" questions from the book. */
const KIDS = [['Rohan', 12], ['Simran', 37], ['Akash', 48], ['Suwali', 53], ['Javed', 20], ['Zoha', 43]];
const PAIRS = [['Rohan', 'Suwali'], ['Zoha', 'Javed'], ['Rohan', 'Simran'], ['Zoha', 'Akash']];
const num = Object.fromEntries(KIDS);
let steps, s, sub;
G.$('#tb').innerHTML = KIDS.map(([n, f], i) => `<tr data-r="${i}"><td>${n}</td><td class="pic">${'<span class="gar"></span>'.repeat(Math.floor(f / 10))}<span class="fl">${'🌼'.repeat(f % 10)}</span></td>${[0, 1, 2].map((c) => `<td><span class="m-box" data-r="${i}" data-c="${c}">?</span></td>`).join('')}</tr>`).join('');
function start() {
  steps = KIDS.map(([n, f], i) => ({ row: i, vals: [Math.floor(f / 10), f % 10, f] })).concat(PAIRS.map(([x, y]) => ({ pair: [x, y], vals: [num[x] + num[y]] })));
  s = 0; next();
}
function next() {
  if (s >= steps.length) { G.end({ title: 'Garlands ready!', msg: 'Tens and ones help us add quickly.', onReplay: () => location.reload() }); return; }
  G.progress(G.$('#pg'), s, steps.length); sub = 0; G.$('#fb').innerHTML = ''; pad.clear(); mark();
}
function mark() {
  const st = steps[s];
  G.$$('#tb tr').forEach((t) => t.classList.toggle('now', +t.dataset.r === st.row));
  G.$$('#tb .m-box').forEach((b) => b.classList.toggle('on', +b.dataset.r === st.row && +b.dataset.c === sub));
  let q;
  if (st.pair) { const [x, y] = st.pair; q = `How many flowers do ${x} and ${y} bring together? ${num[x]} + ${num[y]} = ?`; }
  else q = `${KIDS[st.row][0]}: how many ${['garlands', 'loose flowers', 'flowers in total'][sub]}?`;
  G.$('#q').textContent = q; G.say(q.replace('= ?', ''));
}
const pad = M.pad(G.$('#pad'), {
  show: G.$('#show'),
  onEnter: (v) => {
    pad.clear(); const st = steps[s];
    if (v !== st.vals[sub]) { G.sfx('bad'); G.feedback(G.$('#fb'), false, '🙂 Count again.'); return; }
    G.sfx('good'); G.$('#fb').innerHTML = '';
    if (!st.pair) { const b = G.$(`#tb .m-box[data-r="${st.row}"][data-c="${sub}"]`); b.textContent = v; b.className = 'm-box good'; }
    if (++sub < st.vals.length) { mark(); return; }
    G.star();
    const [x, y] = st.pair || [];
    const msg = st.pair ? `${x} and ${y} bring ${v} flowers together.` : `${KIDS[st.row][0]} has ${st.vals[0]} garlands and ${st.vals[1]} flowers: ${st.vals[0] * 10} + ${st.vals[1]} = ${v}.`;
    G.feedback(G.$('#fb'), true, '🎉 ' + msg); G.say(msg);
    s++; setTimeout(next, 3000);
  },
});
start();
</script>
</body>
</html>
