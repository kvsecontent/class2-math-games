<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../assets/style.css">
<style>
  .race { display: flex; flex-direction: column; gap: 0.6rem; margin-bottom: 1rem; }
  .lane { position: relative; height: 6.4rem; border-radius: 1.2rem; background: repeating-linear-gradient(90deg, #8fd67e 0 3rem, #7fcf6c 3rem 6rem); border: 0.3rem solid #4c9a3c; overflow: hidden; }
  .lane::after { content: '🏁'; position: absolute; right: 0.6rem; top: 50%; transform: translateY(-50%); font-size: 3.6rem; }
  .lane .name { position: absolute; left: 0.8rem; top: 0.3rem; font-weight: 800; font-size: 1.2rem; color: #fff; text-shadow: 0 1px 2px #000; z-index: 1; }
  .rider { position: absolute; top: 50%; font-size: 4.6rem; line-height: 1; transition: left 0.9s cubic-bezier(.3, 1.4, .5, 1); transform: translateY(-50%); }
  .rider span { display: inline-block; transform: scaleX(-1); }
  .lane.turn { box-shadow: 0 0 0 0.4rem var(--yellow); }
  .lane.a { border-color: var(--red); } .lane.b { border-color: var(--blue); }
  .turn-tag { font-size: 1.8rem; font-weight: 800; padding: 0.3rem 1.2rem; border-radius: 1rem; color: #fff; display: inline-block; }
  .q .e { font-size: 5rem; line-height: 1; }
  .q .t { font-family: var(--read); font-size: 2.5rem; margin: 0.4rem 0 1rem; }
  .choice { font-family: var(--read); font-size: 2.2rem; }
  .setup .row input { font-family: var(--head); font-size: 1.8rem; padding: 0.5rem 1rem; border-radius: 1rem; border: 0.2rem solid var(--line); width: 16rem; }
</style>
</head>
<body>
<main class="stage center">
  <div class="race" style="width:100%">
    <div class="lane a" id="laneA"><span class="name" id="nameA">Team A</span><div class="rider" id="rA" style="left:1%"><span>🐸</span></div></div>
    <div class="lane b" id="laneB"><span class="name" id="nameB">Team B</span><div class="rider" id="rB" style="left:1%"><span>🐇</span></div></div>
  </div>
  <div class="card setup center" id="setup" style="width:100%;max-width:70rem">
    <div class="prompt">🏁 Frog Race</div>
    <p class="hint">Two teams take turns. Each right answer makes your frog hop forward. First to the 🏁 wins!</p>
    <div class="row"><input id="inA" value="Team A" aria-label="Team A name"><input id="inB" value="Team B" aria-label="Team B name"></div>
    <br><button class="big-btn green" id="go">▶ Start the race</button>
  </div>
  <div class="card" id="game" style="width:100%;max-width:76rem;display:none"></div>
</main>
<script src="../assets/common.js"></script>
<script>
G.init({ title: 'Frog Race', subtitle: 'Fun with Numbers · Whole chapter challenge', back: '../index.html#ch3' });

/* Questions from the whole chapter (o[0] is the right answer). */
const BANK = [
  { e: '📿', t: 'How many beads are there in a ginladi?', o: ['100', '10', '50'] },
  { e: '📿', t: '3 full rods and 8 beads make ____.', o: ['38', '83', '11'] },
  { e: '🦋', t: 'The butterfly is on 4. It moves 5 steps forward. Where is it now?', o: ['9', '1', '45'] },
  { e: '🐿️', t: 'The squirrel is on 10. It jumps 2 steps backward. Where is it now?', o: ['8', '12', '2'] },
  { e: '🐸', t: 'The frog is on 12. It jumps 7 steps backward. Where is it now?', o: ['5', '19', '7'] },
  { e: '🐜', t: 'An ant sits halfway between 60 and 70. Which number is it on?', o: ['65', '61', '75'] },
  { e: '🐸', t: '1, 4, 7, ____', o: ['10', '8', '11'] },
  { e: '🐸', t: '40, 45, 50, ____', o: ['55', '51', '60'] },
  { e: '🐸', t: '50, 60, 70, ____', o: ['80', '71', '75'] },
  { e: '⬅️', t: '40, 37, 34, ____', o: ['31', '33', '30'] },
  { e: '⬅️', t: '70, 65, 60, ____', o: ['55', '50', '59'] },
  { e: '⬅️', t: '100, 80, 60, ____', o: ['40', '50', '20'] },
  { e: '⬅️', t: 'What comes just before 10?', o: ['9', '11', '1'] },
  { e: '🔢', t: 'Which numbers are common to skips in 2s and 5s?', o: ['10, 20, 30', '2, 4, 6', '5, 15, 25'] },
  { e: '🔢', t: 'Which numbers are common to skips in 5s and 7s?', o: ['35, 70', '5, 7', '12, 14'] },
  { e: '🔢', t: 'Which numbers are common to skips in 2s, 3s and 5s?', o: ['30, 60, 90', '10, 20', '6, 12'] },
  { e: '🐸', t: 'Start from 10 and jump in tens. Will you land on 100?', o: ['Yes', 'No'] },
  { e: '🐸', t: 'Start from 4 and jump in twos. Will you land on 17?', o: ['No', 'Yes'] },
  { e: '🐸', t: 'Start from 13 and jump in threes. Will you land on 24?', o: ['No', 'Yes'] },
  { e: '🐸', t: 'Start from 5 and jump in fives. Will you land on 40?', o: ['Yes', 'No'] },
  { e: '🗣️', t: 'Rizwan counts from 20 onwards. Will he say 19?', o: ['No', 'Yes'] },
  { e: '🗣️', t: 'Chavi counts in twos from 10. Will she say 43?', o: ['No', 'Yes'] },
  { e: '🗣️', t: 'Mala counts backwards from 20 to 0. How many steps?', o: ['20', '10', '19'] },
  { e: '🗣️', t: 'Viraaj counts backwards in twos from 20 to 0. How many steps?', o: ['10', '20', '2'] },
  { e: '🪟', t: 'In the number chart, which number is just above 28?', o: ['18', '38', '27'] },
  { e: '🪟', t: 'In the number chart, which number is just below 28?', o: ['38', '18', '29'] },
  { e: '🪟', t: 'In the number chart, which number is to the right of 53?', o: ['54', '52', '63'] },
  { e: '🪟', t: 'In the number chart, which number is to the left of 74?', o: ['73', '75', '64'] },
  { e: '🟩', t: '1, 12, 23, 34, ____', o: ['45', '35', '44'] },
  { e: '🧱', t: 'Blocks: 1, 3, 6, ____', o: ['10', '9', '8'] },
  { e: '🧱', t: 'Blocks: 1, 4, 9, ____', o: ['16', '12', '13'] },
  { e: '🎲', t: 'Two dice show 3 and 4. What is the sum?', o: ['7', '34', '12'] },
  { e: '🎲', t: 'In Bingo, which number can never come with two dice?', o: ['1', '7', '12'] },
];
const STEPS = 7;
const T = [{ id: 'A', pos: 0, col: 'var(--red)' }, { id: 'B', pos: 0, col: 'var(--blue)' }];
let turn = 0, deck = [], name = ['Team A', 'Team B'];

function place() { T.forEach((t) => (G.$('#r' + t.id).style.left = 1 + (t.pos / STEPS) * 84 + '%')); }

G.$('#go').onclick = () => {
  name = [G.$('#inA').value || 'Team A', G.$('#inB').value || 'Team B'];
  G.$('#nameA').textContent = name[0];
  G.$('#nameB').textContent = name[1];
  G.$('#setup').style.display = 'none';
  G.$('#game').style.display = '';
  start();
};

function start() {
  T.forEach((t) => (t.pos = 0));
  turn = 0;
  deck = G.shuffle(BANK);
  place();
  ask();
}

function ask() {
  if (!deck.length) deck = G.shuffle(BANK);
  const q = deck.pop();
  const t = T[turn];
  G.$('#laneA').classList.toggle('turn', turn === 0);
  G.$('#laneB').classList.toggle('turn', turn === 1);
  const g = G.$('#game');
  g.innerHTML = `<span class="turn-tag" style="background:${t.col}">${name[turn]}'s turn</span>
    <div class="q"><div class="e">${q.e}</div><div class="t">${q.t}</div></div>
    <div class="row" id="opts"></div><div class="feedback" id="fb"></div>`;
  G.say(name[turn] + '. ' + q.t.replace(/_+/g, 'blank').replace(/…/g, ','));
  G.shuffle(q.o).forEach((o) => {
    const b = document.createElement('button');
    b.className = 'choice';
    b.textContent = o;
    b.onclick = () => answer(b, o === q.o[0], q);
    G.$('#opts').append(b);
  });
}

function answer(b, ok, q) {
  G.$$('#opts .choice').forEach((x) => (x.disabled = true));
  const fb = G.$('#fb');
  if (ok) {
    b.classList.add('right');
    G.sfx('good');
    G.feedback(fb, true, `🎉 Right! ${name[turn]} moves ahead!`);
    G.say('Right!');
    T[turn].pos++;
    place();
    if (T[turn].pos >= STEPS) {
      setTimeout(() => G.end({ title: `🏆 ${name[turn]} wins!`, msg: 'Great race, everyone!', onReplay: start }), 1200);
      return;
    }
  } else {
    b.classList.add('wrong');
    G.$$('#opts .choice').find((x) => x.textContent === q.o[0]).classList.add('right');
    G.sfx('bad');
    G.feedback(fb, false, `Oops! The answer is “${q.o[0]}”.`);
    G.say('The answer is ' + q.o[0]);
  }
  turn = 1 - turn;
  setTimeout(ask, 2600);
}
</script>
</body>
</html>
