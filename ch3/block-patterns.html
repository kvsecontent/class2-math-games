<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../assets/style.css">
<style>
  .wrap { display: grid; grid-template-columns: 1fr 20rem; gap: 1.2rem; width: 100%; max-width: 120rem; align-items: center; }
  .figs { display: flex; gap: 2rem; align-items: flex-end; justify-content: center; flex-wrap: wrap; background: #fff; border-radius: var(--radius); border: 0.25rem solid var(--line); padding: 1rem; min-height: 22rem; }
  .fig { display: flex; flex-direction: column; align-items: center; gap: 0.4rem; }
  .blk { display: grid; gap: 0.12rem; }
  .blk i { width: 2.6rem; height: 2.6rem; border-radius: 0.3rem; border: 0.15rem solid #2b2140; }
  .blk i.e { visibility: hidden; }
  .fig b { font-size: 2.2rem; }
  .fig.new { animation: pop 0.5s; }
  .fig .m-box { height: 3.6rem; min-width: 4.4rem; font-size: 2.2rem; }
  .q { font-family: var(--read); font-size: 2.2rem; font-weight: 700; margin: 0.6rem 0; }
  .side { display: flex; flex-direction: column; gap: 0.7rem; align-items: center; }
</style>
</head>
<body>
<main class="stage center">
  <p class="hint">Exploring patterns: observe how the number of blocks is increasing. How many blocks will the next shape have?</p>
  <div class="progress" id="pg"></div>
  <div class="q" id="q"></div>
  <div class="wrap">
    <div class="figs" id="figs"></div>
    <div class="side card"><div class="m-box on" id="show">?</div><div id="pad"></div><div class="feedback" id="fb"></div></div>
  </div>
</main>
<script src="../assets/common.js"></script>
<script src="../assets/math.js"></script>
<script>
G.init({ title: 'Growing Patterns', subtitle: 'Fun with Numbers · Exploring patterns', back: '../index.html#ch3' });

/* Book patterns: A 1, 3, 6 · B 1, 4, 9 · C 5, 8. Each shape is drawn as rows of blocks. */
const PATS = [
  { name: 'A', col: '#ff8a3d', rows: (n) => Array.from({ length: n }, (_, i) => i + 1), shown: 3, ask: 2, tip: 'Each new shape gets one more row.' },
  { name: 'B', col: '#2f7de1', rows: (n) => Array(n).fill(n), shown: 3, ask: 2, tip: 'Each shape is a square: 1 by 1, 2 by 2, 3 by 3…' },
  { name: 'C', col: '#2bb673', rows: (n) => [n, n + 1, n + 1], shown: 2, ask: 3, tip: 'Each row gets one more block. That is 3 more each time.' },
];
const count = (P, n) => P.rows(n).reduce((a, b) => a + b, 0);
let p, n;
function fig(P, i, label) {
  const rows = P.rows(i), w = Math.max(...rows);
  return `<div class="fig"><div class="blk" style="grid-template-columns:repeat(${w}, 2.6rem)">${rows.map((r) => '<i style="background:' + P.col + '"></i>'.repeat(r) + '<i class="e"></i>'.repeat(w - r)).join('')}</div>${label}</div>`;
}
function start() { p = 0; next(); }
function next() {
  if (p >= PATS.length) { G.end({ title: 'Pattern builder!', msg: 'You found how each pattern grows.', onReplay: start }); return; }
  G.progress(G.$('#pg'), p, PATS.length);
  const P = PATS[p]; n = P.shown + 1;
  G.$('#figs').innerHTML = Array.from({ length: P.shown }, (_, i) => fig(P, i + 1, `<b>${count(P, i + 1)}</b>`)).join('') + `<div class="fig" id="nx"><span class="m-box on" style="height:6rem;min-width:6rem;font-size:3.4rem">?</span></div>`;
  G.$('#q').textContent = `Pattern ${P.name}: ${Array.from({ length: P.shown }, (_, i) => count(P, i + 1)).join(', ')}, … What comes next?`;
  G.$('#fb').innerHTML = ''; pad.clear();
  G.say(G.$('#q').textContent);
}
const pad = M.pad(G.$('#pad'), {
  show: G.$('#show'),
  onEnter: (v) => {
    pad.clear(); const P = PATS[p], want = count(P, n);
    if (v !== want) { G.sfx('bad'); G.feedback(G.$('#fb'), false, '🙂 ' + P.tip); G.say(P.tip); return; }
    G.$('#nx').outerHTML = fig(P, n, `<b>${want}</b>`).replace('class="fig"', 'class="fig new"');
    G.sfx('good'); G.star(); G.$('#fb').innerHTML = '';
    G.say(String(want));
    if (n < P.shown + P.ask) { n++; G.$('#figs').insertAdjacentHTML('beforeend', `<div class="fig" id="nx"><span class="m-box on" style="height:6rem;min-width:6rem;font-size:3.4rem">?</span></div>`); return; }
    const seq = Array.from({ length: n }, (_, i) => count(P, i + 1)).join(', ');
    G.feedback(G.$('#fb'), true, '🎉 ' + seq); G.say(`${seq}. ${P.tip}`);
    p++; setTimeout(next, 4200);
  },
});
start();
</script>
</body>
</html>
