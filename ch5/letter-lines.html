<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../assets/style.css">
<style>
  .chips { display: flex; flex-wrap: wrap; gap: 0.6rem; justify-content: center; width: 100%; max-width: 120rem; min-height: 7rem; }
  .obj { display: flex; flex-direction: column; align-items: center; width: 8.4rem; min-height: 7.4rem; border: 0.25rem solid var(--line); border-radius: 1.2rem; background: #fff; box-shadow: var(--shadow); justify-content: center; }
  .obj .e { font-size: 4.4rem; line-height: 1.1; font-family: var(--read); font-weight: 700; } .obj .e svg { width: 3.6rem; height: 3.6rem; }
  .obj b { font-size: 1.1rem; }
  .obj.gone { visibility: hidden; }
  .bins { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; width: 100%; max-width: 120rem; margin-top: 0.8rem; }
  .bin { border: 0.35rem dashed; border-radius: var(--radius); min-height: 19rem; padding: 0.5rem; display: flex; flex-direction: column; align-items: center; }
  .bin svg.sh { width: 9rem; height: 4.4rem; pointer-events: none; }
  .bin h3 { margin: 0; font-size: 2rem; pointer-events: none; }
  .bin .got { display: flex; flex-wrap: wrap; gap: 0.4rem; justify-content: center; font-size: 3.2rem; font-family: var(--read); font-weight: 700; pointer-events: none; }
  .bin .got svg { width: 3rem; height: 3rem; }
  .bin.no { animation: shake 0.4s; }
  .bin.a { border-color: var(--blue); background: #e7f1ff; } .bin.b { border-color: var(--pink); background: #fff0f6; } .bin.c { border-color: var(--green); background: #e6f8ef; }
  .q { font-family: var(--read); font-size: 2.2rem; font-weight: 700; margin-top: 0.6rem; }
</style>
</head>
<body>
<main class="stage center">
  <p class="hint">Letters are made of lines! Is each letter made of straight lines, curved lines, or both? Drag it into the right box (or tap it, then the box).</p>
  <div class="chips" id="chips"></div>
  <div class="bins">
    <div class="bin a" data-k="straight"><svg class="sh" viewBox="0 0 180 80"><path d="M10 70 L60 10 L120 70 L170 10" fill="none" stroke="#2f7de1" stroke-width="8"/></svg><h3>Only straight lines</h3><div class="got"></div></div>
    <div class="bin b" data-k="curved"><svg class="sh" viewBox="0 0 180 80"><path d="M10 60 Q50 0 90 40 T170 30" fill="none" stroke="#ff6fa8" stroke-width="8"/></svg><h3>Only curved lines</h3><div class="got"></div></div>
    <div class="bin c" data-k="both"><svg class="sh" viewBox="0 0 180 80"><path d="M20 70 L160 70 A70 60 0 0 0 20 70 Z" fill="none" stroke="#2bb673" stroke-width="8"/></svg><h3>Both</h3><div class="got"></div></div>
  </div>
</main>
<script src="../assets/common.js"></script>
<script>
G.init({ title: 'Letters and Lines', subtitle: 'Playing with Lines · Lines around us', back: '../index.html#ch5' });

/* Capital letters sorted by the lines they are made of. */
const OBJ = [...'EFHILTAKMNVWXYZ'].map((l) => [l, 'letter ' + l, 'straight']).concat([...'COS'].map((l) => [l, 'letter ' + l, 'curved']), [...'BDGJPRU'].map((l) => [l, 'letter ' + l, 'both']));
const PICK = () => G.shuffle(OBJ.filter((o) => o[2] === 'straight')).slice(0, 5).concat(OBJ.filter((o) => o[2] === 'curved'), G.shuffle(OBJ.filter((o) => o[2] === 'both')).slice(0, 4));
const SET = PICK();
G.$('#chips').innerHTML = G.shuffle(SET).map(([e, n, k]) => `<button class="obj" data-k="${k}" data-n="${n}"><span class="e">${e}</span><b>${n}</b></button>`).join('');
let done = 0;
G.tapDrag(G.$$('#chips .obj'), G.$$('.bin'), (chip, bin) => {
  const n = chip.dataset.n, k = chip.dataset.k;
  if (bin.dataset.k !== k) { bin.classList.remove('no'); void bin.offsetWidth; bin.classList.add('no'); G.sfx('bad'); G.say(`Look at the lines of the ${n} again.`); return; }
  chip.classList.add('gone'); chip.dataset.locked = 1;
  G.$('.got', bin).insertAdjacentHTML('beforeend', `<span>${G.$('.e', chip).innerHTML}</span>`);
  G.sfx('good'); G.star(); G.say(k === 'both' ? `The ${n} has straight and curved lines.` : `The ${n} has only ${k} lines.`);
  if (++done === SET.length) think();
});
function think() { setTimeout(() => G.end({ title: 'Letter detective!', msg: 'Now look for straight and curved lines in the words around you.', onReplay: () => location.reload() }), 1600); }
G.say('Straight lines, curved lines, or both?');
</script>
</body>
</html>
