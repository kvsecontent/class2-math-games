<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../assets/style.css">
<style>
  .race { display: flex; flex-direction: column; gap: 0.6rem; margin-bottom: 1rem; }
  .lane { position: relative; height: 6.4rem; border-radius: 1.2rem; background: repeating-linear-gradient(90deg, #e07a4f 0 3rem, #d96a3c 3rem 6rem); border: 0.3rem solid #a8462a; overflow: hidden; }
  .lane::after { content: '🏁'; position: absolute; right: 0.6rem; top: 50%; transform: translateY(-50%); font-size: 3.6rem; }
  .lane .name { position: absolute; left: 0.8rem; top: 0.3rem; font-weight: 800; font-size: 1.2rem; color: #fff; text-shadow: 0 1px 2px #000; z-index: 1; }
  .rider { position: absolute; top: 50%; font-size: 4.6rem; line-height: 1; transition: left 0.9s cubic-bezier(.3, 1.4, .5, 1); transform: translateY(-50%); }
  .rider span { display: inline-block; transform: scaleX(-1); }
  .lane.turn { box-shadow: 0 0 0 0.4rem var(--yellow); }
  .lane.a { border-color: var(--red); } .lane.b { border-color: var(--blue); }
  .turn-tag { font-size: 1.8rem; font-weight: 800; padding: 0.3rem 1.2rem; border-radius: 1rem; color: #fff; display: inline-block; }
  .q .e { font-size: 5rem; line-height: 1; }
  .q .t { font-family: var(--read); font-size: 2.5rem; margin: 0.4rem 0 1rem; }
  .choice { font-family: var(--read); font-size: 2.2rem; }
  .setup .row input { font-family: var(--head); font-size: 1.8rem; padding: 0.5rem 1rem; border-radius: 1rem; border: 0.2rem solid var(--line); width: 16rem; }
</style>
</head>
<body>
<main class="stage center">
  <div class="race" style="width:100%">
    <div class="lane a" id="laneA"><span class="name" id="nameA">Team A</span><div class="rider" id="rA" style="left:1%"><span>🏃</span></div></div>
    <div class="lane b" id="laneB"><span class="name" id="nameB">Team B</span><div class="rider" id="rB" style="left:1%"><span>🏃‍♀️</span></div></div>
  </div>
  <div class="card setup center" id="setup" style="width:100%;max-width:70rem">
    <div class="prompt">🏁 Line Race</div>
    <p class="hint">Two teams take turns. Each right answer moves your runner forward. First to the 🏁 wins!</p>
    <div class="row"><input id="inA" value="Team A" aria-label="Team A name"><input id="inB" value="Team B" aria-label="Team B name"></div>
    <br><button class="big-btn green" id="go">▶ Start the race</button>
  </div>
  <div class="card" id="game" style="width:100%;max-width:76rem;display:none"></div>
</main>
<script src="../assets/common.js"></script>
<script>
G.init({ title: 'Line Race', subtitle: 'Playing with Lines · Whole chapter challenge', back: '../index.html#ch5' });

/* Questions from the whole chapter (o[0] is the right answer). */
const BANK = [
  { e: '🧍', t: 'In Tadasana we stand straight. Our body makes a ____ line.', o: ['standing', 'sleeping', 'curved'] },
  { e: '🛌', t: 'In Shavasana we lie flat. Our body makes a ____ line.', o: ['sleeping', 'standing', 'curved'] },
  { e: '🌈', t: 'In Chakrasana the back makes a ____ line.', o: ['curved', 'standing', 'sleeping'] },
  { e: '🧘', t: 'Yoga comes from the Yoga Sutras of ____.', o: ['Patanjali', 'Kalidasa', 'Tulsidas'] },
  { e: '🧵', t: 'Pull a thread tight between your hands. It is ____.', o: ['straight', 'curved', 'round'] },
  { e: '🧵', t: 'Bring your hands closer. The thread becomes ____.', o: ['curved', 'straight', 'longer'] },
  { e: '|', t: 'A standing line is also called a ____ line.', o: ['vertical', 'horizontal', 'curved'] },
  { e: '—', t: 'A sleeping line is also called a ____ line.', o: ['horizontal', 'vertical', 'slanting'] },
  { e: '/', t: 'A line like this / is a ____ line.', o: ['slanting', 'sleeping', 'standing'] },
  { e: '🌈', t: 'A rainbow has a ____ line.', o: ['curved', 'straight', 'standing'] },
  { e: '🚪', t: 'The side of a door is a ____ line.', o: ['standing', 'curved', 'slanting'] },
  { e: '🏠', t: 'The roof of a hut has ____ lines.', o: ['slanting', 'curved', 'no'] },
  { e: '🌳', t: 'A tree trunk is a ____ line.', o: ['standing', 'sleeping', 'curved'] },
  { e: '🛤️', t: 'A railway track on flat ground has ____ lines.', o: ['sleeping', 'curved', 'standing'] },
  { e: '☁️', t: 'A cloud is drawn with ____ lines.', o: ['curved', 'straight', 'standing'] },
  { e: '📄', t: 'When we fold paper flat, the crease is always ____.', o: ['straight', 'curved', 'round'] },
  { e: '📄', t: 'Fold a square paper corner to corner. The crease is ____.', o: ['slanting', 'curved', 'standing'] },
  { e: '🔴', t: 'In paper folding, we trace straight lines with the ____ crayon.', o: ['red', 'blue', 'green'] },
  { e: '🔵', t: 'In paper folding, we trace slanting lines with the ____ crayon.', o: ['blue', 'red', 'yellow'] },
  { e: '🔤', t: 'The letter L is made of ____ lines.', o: ['straight', 'curved', 'only round'] },
  { e: '🔤', t: 'The letter O is made of a ____ line.', o: ['curved', 'straight', 'slanting'] },
  { e: '🔤', t: 'Which letter has both straight and curved lines?', o: ['D', 'H', 'O'] },
  { e: '🔤', t: 'Which letter has slanting lines?', o: ['V', 'O', 'L'] },
  { e: '🎨', t: 'Warli art comes from ____.', o: ['Maharashtra', 'Kerala', 'Assam'] },
  { e: '🎨', t: 'A Warli person is made of two ____ and a circle.', o: ['triangles', 'squares', 'stars'] },
  { e: '⚫', t: 'Join two dots one above the other. You get a ____ line.', o: ['standing', 'sleeping', 'curved'] },
  { e: '⚫', t: 'Join two dots side by side. You get a ____ line.', o: ['sleeping', 'standing', 'curved'] },
  { e: '✏️', t: 'How many types of lines did we learn?', o: ['4', '2', '10'] },
];
const STEPS = 7;
const T = [{ id: 'A', pos: 0, col: 'var(--red)' }, { id: 'B', pos: 0, col: 'var(--blue)' }];
let turn = 0, deck = [], name = ['Team A', 'Team B'];

function place() { T.forEach((t) => (G.$('#r' + t.id).style.left = 1 + (t.pos / STEPS) * 84 + '%')); }

G.$('#go').onclick = () => {
  name = [G.$('#inA').value || 'Team A', G.$('#inB').value || 'Team B'];
  G.$('#nameA').textContent = name[0];
  G.$('#nameB').textContent = name[1];
  G.$('#setup').style.display = 'none';
  G.$('#game').style.display = '';
  start();
};

function start() {
  T.forEach((t) => (t.pos = 0));
  turn = 0;
  deck = G.shuffle(BANK);
  place();
  ask();
}

function ask() {
  if (!deck.length) deck = G.shuffle(BANK);
  const q = deck.pop();
  const t = T[turn];
  G.$('#laneA').classList.toggle('turn', turn === 0);
  G.$('#laneB').classList.toggle('turn', turn === 1);
  const g = G.$('#game');
  g.innerHTML = `<span class="turn-tag" style="background:${t.col}">${name[turn]}'s turn</span>
    <div class="q"><div class="e">${q.e}</div><div class="t">${q.t}</div></div>
    <div class="row" id="opts"></div><div class="feedback" id="fb"></div>`;
  G.say(name[turn] + '. ' + q.t.replace(/_+/g, 'blank').replace(/…/g, ','));
  G.shuffle(q.o).forEach((o) => {
    const b = document.createElement('button');
    b.className = 'choice';
    b.textContent = o;
    b.onclick = () => answer(b, o === q.o[0], q);
    G.$('#opts').append(b);
  });
}

function answer(b, ok, q) {
  G.$$('#opts .choice').forEach((x) => (x.disabled = true));
  const fb = G.$('#fb');
  if (ok) {
    b.classList.add('right');
    G.sfx('good');
    G.feedback(fb, true, `🎉 Right! ${name[turn]} moves ahead!`);
    G.say('Right!');
    T[turn].pos++;
    place();
    if (T[turn].pos >= STEPS) {
      setTimeout(() => G.end({ title: `🏆 ${name[turn]} wins!`, msg: 'Great race, everyone!', onReplay: start }), 1200);
      return;
    }
  } else {
    b.classList.add('wrong');
    G.$$('#opts .choice').find((x) => x.textContent === q.o[0]).classList.add('right');
    G.sfx('bad');
    G.feedback(fb, false, `Oops! The answer is “${q.o[0]}”.`);
    G.say('The answer is ' + q.o[0]);
  }
  turn = 1 - turn;
  setTimeout(ask, 2600);
}
</script>
</body>
</html>
