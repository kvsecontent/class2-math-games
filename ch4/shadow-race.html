<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../assets/style.css">
<style>
  .race { display: flex; flex-direction: column; gap: 0.6rem; margin-bottom: 1rem; }
  .lane { position: relative; height: 6.4rem; border-radius: 1.2rem; background: repeating-linear-gradient(90deg, #ffd34d 0 3rem, #ffc93c 3rem 6rem); border: 0.3rem solid #c98a1c; overflow: hidden; }
  .lane::after { content: '🏁'; position: absolute; right: 0.6rem; top: 50%; transform: translateY(-50%); font-size: 3.6rem; }
  .lane .name { position: absolute; left: 0.8rem; top: 0.3rem; font-weight: 800; font-size: 1.2rem; color: #fff; text-shadow: 0 1px 2px #000; z-index: 1; }
  .rider { position: absolute; top: 50%; font-size: 4.6rem; line-height: 1; transition: left 0.9s cubic-bezier(.3, 1.4, .5, 1); transform: translateY(-50%); }
  .rider span { display: inline-block; transform: scaleX(-1); }
  .lane.turn { box-shadow: 0 0 0 0.4rem var(--yellow); }
  .lane.a { border-color: var(--red); } .lane.b { border-color: var(--blue); }
  .turn-tag { font-size: 1.8rem; font-weight: 800; padding: 0.3rem 1.2rem; border-radius: 1rem; color: #fff; display: inline-block; }
  .q .e { font-size: 5rem; line-height: 1; }
  .q .t { font-family: var(--read); font-size: 2.5rem; margin: 0.4rem 0 1rem; }
  .choice { font-family: var(--read); font-size: 2.2rem; }
  .setup .row input { font-family: var(--head); font-size: 1.8rem; padding: 0.5rem 1rem; border-radius: 1rem; border: 0.2rem solid var(--line); width: 16rem; }
</style>
</head>
<body>
<main class="stage center">
  <div class="race" style="width:100%">
    <div class="lane a" id="laneA"><span class="name" id="nameA">Team A</span><div class="rider" id="rA" style="left:1%"><span>🐕</span></div></div>
    <div class="lane b" id="laneB"><span class="name" id="nameB">Team B</span><div class="rider" id="rB" style="left:1%"><span>🐇</span></div></div>
  </div>
  <div class="card setup center" id="setup" style="width:100%;max-width:70rem">
    <div class="prompt">🏁 Shadow Race</div>
    <p class="hint">Two teams take turns. Each right answer moves your animal forward. First to the 🏁 wins!</p>
    <div class="row"><input id="inA" value="Team A" aria-label="Team A name"><input id="inB" value="Team B" aria-label="Team B name"></div>
    <br><button class="big-btn green" id="go">▶ Start the race</button>
  </div>
  <div class="card" id="game" style="width:100%;max-width:76rem;display:none"></div>
</main>
<script src="../assets/common.js"></script>
<script>
G.init({ title: 'Shadow Race', subtitle: 'Shadow Story · Whole chapter challenge', back: '../index.html#ch4' });

/* Questions from the whole chapter (o[0] is the right answer). */
const BANK = [
  { e: '🎭', t: 'Togalu Gombeyaata is a shadow puppet show from ____.', o: ['Karnataka', 'Kerala', 'Punjab'] },
  { e: '🔦', t: 'We see a shadow when something blocks the ____.', o: ['light', 'water', 'sound'] },
  { e: '🌑', t: 'When does a shadow vanish?', o: ['when there is no light', 'when the sun shines', 'when the torch is on'] },
  { e: '🔦', t: 'The torch comes closer to the toy. The shadow gets ____.', o: ['bigger', 'smaller', 'green'] },
  { e: '☀️', t: 'When is your shadow shortest?', o: ['around 12 noon', 'early morning', 'evening'] },
  { e: '🌅', t: 'When is your shadow longest?', o: ['early morning or evening', 'at noon', 'never'] },
  { e: '🧢', t: 'The trace of a bottle cap is a ____.', o: ['circle', 'square', 'triangle'] },
  { e: '🩹', t: 'The trace of an eraser is a ____.', o: ['rectangle', 'circle', 'triangle'] },
  { e: '🪙', t: 'Which object has the same trace as a bottle cap?', o: ['coin', 'matchbox', 'book'] },
  { e: '📦', t: 'Which object has the same trace as an eraser?', o: ['matchbox', 'coin', 'bangle'] },
  { e: '🕰️', t: 'Circle can hide in the ____.', o: ['clock', 'door', 'TV'] },
  { e: '📺', t: 'Rectangle can hide in the ____.', o: ['TV', 'coin', 'plate'] },
  { e: '🍕', t: 'Triangle can hide in a ____.', o: ['pizza slice', 'clock', 'door'] },
  { e: '🎲', t: 'Square can hide in a ____.', o: ['dice', 'ball', 'plate'] },
  { e: '🔺', t: 'On the carpet, triangles are coloured ____.', o: ['red', 'green', 'blue'] },
  { e: '⚪', t: 'On the carpet, circles are coloured ____.', o: ['green', 'yellow', 'red'] },
  { e: '▬', t: 'On the carpet, rectangles are coloured ____.', o: ['yellow', 'blue', 'green'] },
  { e: '⬜', t: 'On the carpet, squares are coloured ____.', o: ['blue', 'red', 'yellow'] },
  { e: '🪑', t: 'A rectangular table has how many corners?', o: ['4', '3', '0'] },
  { e: '⭕', t: 'Can “Catch the Corner” be played around a round table?', o: ['No', 'Yes'] },
  { e: '👏', t: 'In Catch the Corner, who claps next?', o: ['the child not at a corner', 'the tallest child', 'the teacher'] },
  { e: '🪙', t: 'How many corners does a coin have?', o: ['0', '1', '4'] },
  { e: '🍕', t: 'A pizza slice has ____ edges.', o: ['straight and curved', 'only curved', 'only straight'] },
  { e: '📕', t: 'A book has ____ edges.', o: ['straight', 'curved', 'no'] },
  { e: '📄', t: 'Fold a square paper by joining two corners. You get a ____.', o: ['triangle', 'circle', 'square'] },
  { e: '🔺', t: 'A triangle has how many corners?', o: ['3', '4', '2'] },
  { e: '⬜', t: 'A square paper has how many corners?', o: ['4', '3', '6'] },
  { e: '🔤', t: 'AB, BC, CD, ____', o: ['DE', 'DC', 'EF'] },
  { e: '🔤', t: 'AA, BB, CC, DD, ____', o: ['EE', 'DE', 'FF'] },
  { e: '🔢', t: '5, 10, 15, ____', o: ['20', '16', '25'] },
  { e: '🔢', t: '7, 14, 21, ____', o: ['28', '22', '27'] },
  { e: '🔢', t: '1, 7, 13, ____', o: ['19', '14', '20'] },
  { e: '🐰', t: 'Kikku jumps 1, 4, 7, ____', o: ['10', '8', '11'] },
  { e: '🐇', t: 'Kikku’s mother jumps 1, 6, 11, ____', o: ['16', '12', '15'] },
];
const STEPS = 7;
const T = [{ id: 'A', pos: 0, col: 'var(--red)' }, { id: 'B', pos: 0, col: 'var(--blue)' }];
let turn = 0, deck = [], name = ['Team A', 'Team B'];

function place() { T.forEach((t) => (G.$('#r' + t.id).style.left = 1 + (t.pos / STEPS) * 84 + '%')); }

G.$('#go').onclick = () => {
  name = [G.$('#inA').value || 'Team A', G.$('#inB').value || 'Team B'];
  G.$('#nameA').textContent = name[0];
  G.$('#nameB').textContent = name[1];
  G.$('#setup').style.display = 'none';
  G.$('#game').style.display = '';
  start();
};

function start() {
  T.forEach((t) => (t.pos = 0));
  turn = 0;
  deck = G.shuffle(BANK);
  place();
  ask();
}

function ask() {
  if (!deck.length) deck = G.shuffle(BANK);
  const q = deck.pop();
  const t = T[turn];
  G.$('#laneA').classList.toggle('turn', turn === 0);
  G.$('#laneB').classList.toggle('turn', turn === 1);
  const g = G.$('#game');
  g.innerHTML = `<span class="turn-tag" style="background:${t.col}">${name[turn]}'s turn</span>
    <div class="q"><div class="e">${q.e}</div><div class="t">${q.t}</div></div>
    <div class="row" id="opts"></div><div class="feedback" id="fb"></div>`;
  G.say(name[turn] + '. ' + q.t.replace(/_+/g, 'blank').replace(/…/g, ','));
  G.shuffle(q.o).forEach((o) => {
    const b = document.createElement('button');
    b.className = 'choice';
    b.textContent = o;
    b.onclick = () => answer(b, o === q.o[0], q);
    G.$('#opts').append(b);
  });
}

function answer(b, ok, q) {
  G.$$('#opts .choice').forEach((x) => (x.disabled = true));
  const fb = G.$('#fb');
  if (ok) {
    b.classList.add('right');
    G.sfx('good');
    G.feedback(fb, true, `🎉 Right! ${name[turn]} moves ahead!`);
    G.say('Right!');
    T[turn].pos++;
    place();
    if (T[turn].pos >= STEPS) {
      setTimeout(() => G.end({ title: `🏆 ${name[turn]} wins!`, msg: 'Great race, everyone!', onReplay: start }), 1200);
      return;
    }
  } else {
    b.classList.add('wrong');
    G.$$('#opts .choice').find((x) => x.textContent === q.o[0]).classList.add('right');
    G.sfx('bad');
    G.feedback(fb, false, `Oops! The answer is “${q.o[0]}”.`);
    G.say('The answer is ' + q.o[0]);
  }
  turn = 1 - turn;
  setTimeout(ask, 2600);
}
</script>
</body>
</html>
