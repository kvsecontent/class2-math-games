<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../assets/style.css">
<style>
  .chips { display: flex; flex-wrap: wrap; gap: 0.6rem; justify-content: center; width: 100%; max-width: 120rem; min-height: 7rem; }
  .obj { display: flex; flex-direction: column; align-items: center; width: 8.4rem; min-height: 7.4rem; border: 0.25rem solid var(--line); border-radius: 1.2rem; background: #fff; box-shadow: var(--shadow); justify-content: center; }
  .obj .e { font-size: 3.4rem; line-height: 1.1; } .obj .e svg { width: 3.6rem; height: 3.6rem; }
  .obj b { font-size: 1.1rem; }
  .obj.gone { visibility: hidden; }
  .bins { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; width: 100%; max-width: 120rem; margin-top: 0.8rem; }
  .bin { border: 0.35rem dashed; border-radius: var(--radius); min-height: 19rem; padding: 0.5rem; display: flex; flex-direction: column; align-items: center; }
  .bin svg.sh { width: 9rem; height: 4.4rem; pointer-events: none; }
  .bin h3 { margin: 0; font-size: 2rem; pointer-events: none; }
  .bin .got { display: flex; flex-wrap: wrap; gap: 0.2rem; justify-content: center; font-size: 2.8rem; pointer-events: none; }
  .bin .got svg { width: 3rem; height: 3rem; }
  .bin.no { animation: shake 0.4s; }
  .bin.a { border-color: var(--blue); background: #e7f1ff; } .bin.b { border-color: var(--pink); background: #fff0f6; } .bin.c { border-color: var(--green); background: #e6f8ef; }
  .q { font-family: var(--read); font-size: 2.2rem; font-weight: 700; margin-top: 0.6rem; }
</style>
</head>
<body>
<main class="stage center">
  <p class="hint">Look at the edges! Straight edges, curved edges, or both? Drag each object into the right box (or tap it, then the box).</p>
  <div class="chips" id="chips"></div>
  <div class="bins">
    <div class="bin a" data-k="straight"><svg class="sh" viewBox="0 0 180 80"><path d="M10 70 L60 10 L120 70 L170 10" fill="none" stroke="#2f7de1" stroke-width="8"/></svg><h3>Straight edges</h3><div class="got"></div></div>
    <div class="bin b" data-k="curved"><svg class="sh" viewBox="0 0 180 80"><path d="M10 60 Q50 0 90 40 T170 30" fill="none" stroke="#ff6fa8" stroke-width="8"/></svg><h3>Curved edges</h3><div class="got"></div></div>
    <div class="bin c" data-k="both"><svg class="sh" viewBox="0 0 180 80"><path d="M20 70 L160 70 A70 60 0 0 0 20 70 Z" fill="none" stroke="#2bb673" stroke-width="8"/></svg><h3>Both</h3><div class="got"></div></div>
  </div>
  <div class="q" id="q"></div>
  <div class="row" id="opts"></div>
</main>
<script src="../assets/common.js"></script>
<script>
G.init({ title: 'Straight or Curved?', subtitle: 'Shadow Story · Edges around us', back: '../index.html#ch4' });

const BANGLE = '<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="38" fill="none" stroke="#ffc93c" stroke-width="12"/><circle cx="50" cy="50" r="38" fill="none" stroke="#c99a00" stroke-width="2"/></svg>';
const OBJ = [
  ['📕', 'book', 'straight'], ['📺', 'TV', 'straight'], ['🚪', 'door', 'straight'], ['🎲', 'dice', 'straight'], ['🪟', 'window', 'straight'],
  ['🪙', 'coin', 'curved'], ['🍽️', 'plate', 'curved'], ['🕰️', 'clock', 'curved'], [BANGLE, 'bangle', 'curved'], ['🔘', 'button', 'curved'],
  ['🍕', 'pizza slice', 'both'], ['🍉', 'watermelon slice', 'both'], ['🔒', 'lock', 'both'],
];
G.$('#chips').innerHTML = G.shuffle(OBJ).map(([e, n, k]) => `<button class="obj" data-k="${k}" data-n="${n}"><span class="e">${e}</span><b>${n}</b></button>`).join('');
let done = 0;
G.tapDrag(G.$$('#chips .obj'), G.$$('.bin'), (chip, bin) => {
  const n = chip.dataset.n, k = chip.dataset.k;
  if (bin.dataset.k !== k) { bin.classList.remove('no'); void bin.offsetWidth; bin.classList.add('no'); G.sfx('bad'); G.say(`Look at the edges of the ${n} again.`); return; }
  chip.classList.add('gone'); chip.dataset.locked = 1;
  G.$('.got', bin).insertAdjacentHTML('beforeend', `<span>${G.$('.e', chip).innerHTML}</span>`);
  G.sfx('good'); G.star(); G.say(k === 'both' ? `The ${n} has straight and curved edges.` : `The ${n} has ${k} edges.`);
  if (++done === OBJ.length) think();
});
/* Let us Think A from the book. */
function think() {
  G.$('#q').textContent = 'How many corners do objects with only curved edges have?';
  G.$('#opts').innerHTML = ['0', '1', '4'].map((o) => `<button class="choice">${o}</button>`).join('');
  G.say(G.$('#q').textContent);
  G.$$('#opts .choice').forEach((b) => (b.onclick = () => {
    if (b.textContent !== '0') { b.classList.add('wrong'); G.sfx('bad'); setTimeout(() => b.classList.remove('wrong'), 500); return; }
    b.classList.add('right'); G.star(); G.say('None! A coin or a bangle has no corners.');
    setTimeout(() => G.end({ title: 'Edge explorer!', msg: 'Now look around your classroom for straight and curved edges.', onReplay: () => location.reload() }), 2200);
  }));
}
G.say('Straight edges, curved edges, or both?');
</script>
</body>
</html>
