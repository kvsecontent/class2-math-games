<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../assets/style.css">
<style>
  .race { display: flex; flex-direction: column; gap: 0.6rem; margin-bottom: 1rem; }
  .lane { position: relative; height: 6.4rem; border-radius: 1.2rem; background: repeating-linear-gradient(90deg, #a07850 0 0.6rem, #d9c7a8 0.6rem 3rem); border: 0.3rem solid #6b4220; overflow: hidden; }
  .lane::after { content: '🏁'; position: absolute; right: 0.6rem; top: 50%; transform: translateY(-50%); font-size: 3.6rem; }
  .lane .name { position: absolute; left: 0.8rem; top: 0.3rem; font-weight: 800; font-size: 1.2rem; color: #fff; text-shadow: 0 1px 2px #000; z-index: 1; }
  .rider { position: absolute; top: 50%; font-size: 4.6rem; line-height: 1; transition: left 0.9s cubic-bezier(.3, 1.4, .5, 1); transform: translateY(-50%); }
  .rider span { display: inline-block; transform: scaleX(-1); }
  .lane.turn { box-shadow: 0 0 0 0.4rem var(--yellow); }
  .lane.a { border-color: var(--red); } .lane.b { border-color: var(--blue); }
  .turn-tag { font-size: 1.8rem; font-weight: 800; padding: 0.3rem 1.2rem; border-radius: 1rem; color: #fff; display: inline-block; }
  .q .e { font-size: 5rem; line-height: 1; }
  .q .t { font-family: var(--read); font-size: 2.5rem; margin: 0.4rem 0 1rem; }
  .choice { font-family: var(--read); font-size: 2.2rem; }
  .setup .row input { font-family: var(--head); font-size: 1.8rem; padding: 0.5rem 1rem; border-radius: 1rem; border: 0.2rem solid var(--line); width: 16rem; }
</style>
</head>
<body>
<main class="stage center">
  <div class="race" style="width:100%">
    <div class="lane a" id="laneA"><span class="name" id="nameA">Team A</span><div class="rider" id="rA" style="left:1%"><span>🚂</span></div></div>
    <div class="lane b" id="laneB"><span class="name" id="nameB">Team B</span><div class="rider" id="rB" style="left:1%"><span>🚄</span></div></div>
  </div>
  <div class="card setup center" id="setup" style="width:100%;max-width:70rem">
    <div class="prompt">🏁 Train Race</div>
    <p class="hint">Two teams take turns. Each right answer moves your train forward. First to the 🏁 wins!</p>
    <div class="row"><input id="inA" value="Team A" aria-label="Team A name"><input id="inB" value="Team B" aria-label="Team B name"></div>
    <br><button class="big-btn green" id="go">▶ Start the race</button>
  </div>
  <div class="card" id="game" style="width:100%;max-width:76rem;display:none"></div>
</main>
<script src="../assets/common.js"></script>
<script>
G.init({ title: 'Train Race', subtitle: 'Which Season is it? · Whole chapter challenge', back: '../index.html#ch9' });

/* Questions from the whole chapter (o[0] is the right answer). */
const BANK = [
  { e: '🌸', t: 'Flowers bloom and birds sing. Which season?', o: ['Spring', 'Winter', 'Autumn'] },
  { e: '☀️', t: 'The shining sun and a long day to play. Which season?', o: ['Summer', 'Winter', 'Rainy'] },
  { e: '🦚', t: 'The peacock dances and the frog hops. Which season?', o: ['Rainy', 'Summer', 'Autumn'] },
  { e: '🍂', t: 'Leaves fall on the ground. Which season?', o: ['Autumn', 'Spring', 'Rainy'] },
  { e: '❄️', t: 'All in snow from head to toe. Which season?', o: ['Winter', 'Summer', 'Spring'] },
  { e: '🎨', t: 'Holi comes in ____.', o: ['Spring', 'Winter', 'Rainy season'] },
  { e: '🎄', t: 'Christmas and Lohri come in ____.', o: ['Winter', 'Summer', 'Spring'] },
  { e: '🇮🇳', t: 'Independence Day and Raksha Bandhan come in the ____.', o: ['Monsoon', 'Winter', 'Spring'] },
  { e: '🏹', t: 'Dussehra comes in ____.', o: ['Autumn', 'Summer', 'Spring'] },
  { e: '📅', t: 'How many days are there in a week?', o: ['7', '5', '30'] },
  { e: '📅', t: 'How many days are there in January?', o: ['31', '30', '28'] },
  { e: '📅', t: 'How many days are there in April?', o: ['30', '31', '28'] },
  { e: '📅', t: 'How many days did February 2023 have?', o: ['28', '30', '31'] },
  { e: '📅', t: 'April 30 days + March 31 days = ____ days', o: ['61', '60', '1'] },
  { e: '📅', t: 'How many Sundays were there in April 2023?', o: ['5', '4', '7'] },
  { e: '📅', t: 'Why do we use a calendar?', o: ['to know the day and date', 'to tell the time', 'to measure weight'] },
  { e: '🍳', t: 'Cooking takes ____.', o: ['hours', 'months', 'years'] },
  { e: '🌱', t: 'A seed growing into a plant takes ____.', o: ['days', 'seconds', 'hours'] },
  { e: '🍂', t: 'A change of season takes ____.', o: ['months', 'hours', 'minutes'] },
  { e: '🚆', t: 'The family went to Vijayawada for ____.', o: ['Mama Ji’s wedding', 'a cricket match', 'a picnic'] },
  { e: '⛰️', t: 'They were at Mangalagiri hills from 11 AM to 5 PM. How many hours?', o: ['6', '5', '16'] },
  { e: '🚄', t: 'Which is the fastest train in India?', o: ['Vande Bharat', 'a goods train', 'a toy train'] },
  { e: '🕕', t: 'The long hand is on 12 and the short hand is on 6. The time is ____.', o: ['6 O’clock', '12 O’clock', '9 O’clock'] },
  { e: '🕒', t: 'The short hand is on 3 and the long hand is on 12. The time is ____.', o: ['3 O’clock', '12 O’clock', '6 O’clock'] },
  { e: '⏰', t: 'Gargi wakes up at ____.', o: ['6 O’clock', '1 O’clock', '9 O’clock'] },
  { e: '🎒', t: 'Gargi goes to school at ____.', o: ['7 O’clock', '12 O’clock', '10 O’clock'] },
  { e: '🌅', t: 'Face the rising sun. In front of you is ____.', o: ['East', 'West', 'North'] },
  { e: '🌅', t: 'Face the rising sun. Behind you is ____.', o: ['West', 'East', 'South'] },
  { e: '👈', t: 'Face the rising sun. On your left is ____.', o: ['North', 'South', 'West'] },
  { e: '👉', t: 'Face the rising sun. On your right is ____.', o: ['South', 'North', 'East'] },
  { e: '🧭', t: 'A tool for finding direction is a ____.', o: ['compass', 'clock', 'ruler'] },
];
const STEPS = 7;
const T = [{ id: 'A', pos: 0, col: 'var(--red)' }, { id: 'B', pos: 0, col: 'var(--blue)' }];
let turn = 0, deck = [], name = ['Team A', 'Team B'];

function place() { T.forEach((t) => (G.$('#r' + t.id).style.left = 1 + (t.pos / STEPS) * 84 + '%')); }

G.$('#go').onclick = () => {
  name = [G.$('#inA').value || 'Team A', G.$('#inB').value || 'Team B'];
  G.$('#nameA').textContent = name[0];
  G.$('#nameB').textContent = name[1];
  G.$('#setup').style.display = 'none';
  G.$('#game').style.display = '';
  start();
};

function start() {
  T.forEach((t) => (t.pos = 0));
  turn = 0;
  deck = G.shuffle(BANK);
  place();
  ask();
}

function ask() {
  if (!deck.length) deck = G.shuffle(BANK);
  const q = deck.pop();
  const t = T[turn];
  G.$('#laneA').classList.toggle('turn', turn === 0);
  G.$('#laneB').classList.toggle('turn', turn === 1);
  const g = G.$('#game');
  g.innerHTML = `<span class="turn-tag" style="background:${t.col}">${name[turn]}'s turn</span>
    <div class="q"><div class="e">${q.e}</div><div class="t">${q.t}</div></div>
    <div class="row" id="opts"></div><div class="feedback" id="fb"></div>`;
  G.say(name[turn] + '. ' + q.t.replace(/_+/g, 'blank').replace(/…/g, ','));
  G.shuffle(q.o).forEach((o) => {
    const b = document.createElement('button');
    b.className = 'choice';
    b.textContent = o;
    b.onclick = () => answer(b, o === q.o[0], q);
    G.$('#opts').append(b);
  });
}

function answer(b, ok, q) {
  G.$$('#opts .choice').forEach((x) => (x.disabled = true));
  const fb = G.$('#fb');
  if (ok) {
    b.classList.add('right');
    G.sfx('good');
    G.feedback(fb, true, `🎉 Right! ${name[turn]} moves ahead!`);
    G.say('Right!');
    T[turn].pos++;
    place();
    if (T[turn].pos >= STEPS) {
      setTimeout(() => G.end({ title: `🏆 ${name[turn]} wins!`, msg: 'Great race, everyone!', onReplay: start }), 1200);
      return;
    }
  } else {
    b.classList.add('wrong');
    G.$$('#opts .choice').find((x) => x.textContent === q.o[0]).classList.add('right');
    G.sfx('bad');
    G.feedback(fb, false, `Oops! The answer is “${q.o[0]}”.`);
    G.say('The answer is ' + q.o[0]);
  }
  turn = 1 - turn;
  setTimeout(ask, 2600);
}
</script>
</body>
</html>
